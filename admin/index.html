<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin Portal</title><link rel='stylesheet' href='/assets/hoa-style.css'></head><body><div class='container'><h1>Admin Portal</h1><div id='auth' class='card'><p>Enter admin PIN</p><input id='pin' type='password'><button id='login'>Login</button></div><div id='dash' style='display:none'></div></div><script src='/assets/hoa-app.js'></script><script>
const auth=document.getElementById('auth'),dash=document.getElementById('dash');document.getElementById('login').onclick=async()=>{if(document.getElementById('pin').value!==BWC.defaultPin){alert('Invalid PIN');return;}auth.style.display='none';dash.style.display='block';render();};
async function render(){const d=await BWC.getData();dash.innerHTML=`<div class='card'><h2>About Us</h2><textarea id='aboutTxt'>${JSON.stringify(d.about,null,2)}</textarea><button onclick='saveJson("about")'>Save About</button></div>
<div class='card'><h2>Events</h2><textarea id='eventsTxt'>${JSON.stringify(d.events,null,2)}</textarea><button onclick='saveJson("events")'>Save Events</button></div>
<div class='card'><h2>Projects</h2><textarea id='projectsTxt'>${JSON.stringify(d.projects,null,2)}</textarea><button onclick='saveJson("projects")'>Save Projects</button></div>
<div class='card'><h2>Resources</h2><textarea id='resourcesTxt'>${JSON.stringify(d.resources,null,2)}</textarea><button onclick='saveJson("resources")'>Save Resources</button></div>
<div class='card'><h2>Map Lots</h2><textarea id='mapLotsTxt'>${JSON.stringify(d.mapLots,null,2)}</textarea><button onclick='saveJson("mapLots")'>Save Map Lots</button></div>
<div class='card'><h2>Resident Submissions</h2><p>Contacts: ${d.contacts.length} | Subscribers: ${d.subscribers.length} | RSVPs: ${d.rsvps.length}</p></div>`;}
window.saveJson=async(key)=>{const d=await BWC.getData();try{d[key]=JSON.parse(document.getElementById(key+'Txt').value);BWC.saveData(d);alert('Saved');}catch(e){alert('Invalid JSON');}};
</script></body></html>
