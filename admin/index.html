<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin Portal</title><link rel='stylesheet' href='/assets/hoa-style.css'></head><body><div class='container'><h1>Admin Portal</h1><div id='auth' class='card'><p>Enter admin PIN</p><input id='pin' type='password'><button id='login'>Login</button></div><div id='dash' style='display:none'></div></div><div id='editorModal' class='modal'><div class='modal-card'><h2 id='modalTitle'></h2><textarea id='modalText' rows='16'></textarea><div class='modal-actions'><button class='secondary' onclick='closeModal()'>Cancel</button><button onclick='saveModal()'>Save</button></div></div></div><script src='/assets/hoa-app.js'></script><script>
const auth=document.getElementById('auth'),dash=document.getElementById('dash');let activeKey='';
document.getElementById('login').onclick=async()=>{if(document.getElementById('pin').value!==BWC.defaultPin){alert('Invalid PIN');return;}auth.style.display='none';dash.style.display='block';render();};
async function render(){const d=await BWC.getData();dash.innerHTML=`<div class='card'><h2>Content Editor</h2><p>Open each section in a modal editor.</p><div class='grid two'><button onclick='openModal("about","About Us")'>Edit About Us</button><button onclick='openModal("events","Events")'>Edit Events</button><button onclick='openModal("projects","Projects")'>Edit Projects</button><button onclick='openModal("resources","Resources")'>Edit Resources</button><button onclick='openModal("mapLots","Map Lots")'>Edit Map Lots</button></div></div><div class='card'><h2>Resident Submissions</h2><p>Contacts: ${d.contacts.length} | Subscribers: ${d.subscribers.length} | RSVPs: ${d.rsvps.length}</p></div>`;}
window.openModal=async(key,label)=>{const d=await BWC.getData();activeKey=key;document.getElementById('modalTitle').textContent='Edit '+label;document.getElementById('modalText').value=JSON.stringify(d[key],null,2);document.getElementById('editorModal').classList.add('open');};
window.closeModal=()=>document.getElementById('editorModal').classList.remove('open');
window.saveModal=async()=>{const d=await BWC.getData();try{d[activeKey]=JSON.parse(document.getElementById('modalText').value);BWC.saveData(d);alert('Saved');closeModal();render();}catch(e){alert('Invalid JSON');}};
</script></body></html>
