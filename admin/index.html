<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin Portal</title><link rel='stylesheet' href='/assets/hoa-style.css'></head><body><nav class="site-top" aria-label="Primary navigation">
  <div class="site-top-inner">
    <a class="site-home" href="/" aria-label="Home">&#8962;</a>
    <div class="site-menu">
      <a href="/about/">About Us</a>
      <div class="site-menu-links">
        <a href="/about/">Our Association</a>
        <a href="/welcome-to-the-neighborhood/">Welcome to the Neighborhood</a>
        <a href="/welcome-new-homeowners/">New Homeowners</a>
      </div>
    </div>
    <div class="site-menu">
      <a href="/quick-reference/">Resources</a>
      <div class="site-menu-links">
        <a href="/neighborhood-map/">Neighborhood Map</a>
        <a href="/quick-reference/">Quick Reference</a>
      </div>
    </div>
    <a href="/contact/">Contacts</a>
    <a class="resident-login-link" href="/resident-portal/">Resident Login</a>
    <div class="site-session"><span id="siteTopUser"></span><button id="siteTopLogout" type="button">Logout</button></div>
  </div>
</nav><div class='container'><h1>Admin Portal</h1><p class='help'>Designed for non-technical updates. Use simple forms below and click <strong>Save All Changes</strong>.</p><div id='auth' class='card'><p>Enter admin PIN</p><div id='adminLoginMsg' class='form-message' role='status'></div><input id='pin' type='password'><button id='login'>Login</button></div><div id='dash' style='display:none'></div></div><script src='/assets/hoa-app.js'></script><script>
const auth=document.getElementById('auth'),dash=document.getElementById('dash');
let workingData=null;

const blank={
  board:{role:'',name:'',description:''},
  committee:{name:'',description:''},
  event:{id:'',title:'',datetime:'',location:'',description:'',image:'',rsvpLink:'#'},
  project:{id:'',name:'',status:'Planned',description:'',documents:[]},
  document:{id:'',name:'',category:'Forms',description:'',url:''},
  resource:{title:'',url:''},
  mapLot:{id:'',address:'',lat:'',lng:''}
};

function uid(prefix){return `${prefix}-${Date.now()}-${Math.floor(Math.random()*1000)}`;}
function escapeHtml(str=''){return String(str).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function clone(v){return JSON.parse(JSON.stringify(v));}
function setMessage(id,text,type='error'){const el=document.getElementById(id); if(!el) return; el.textContent=text||''; el.className=`form-message ${type} ${text?'show':''}`;}
function ensureDefaults(d){
  d.about=d.about||{boardMembers:[],committees:[]};
  d.about.boardMembers=d.about.boardMembers||[];
  d.about.committees=d.about.committees||[];
  d.events=d.events||[]; d.projects=d.projects||[]; d.resources=d.resources||[]; d.mapLots=d.mapLots||[];
  d.contacts=d.contacts||[]; d.subscribers=d.subscribers||[]; d.rsvps=d.rsvps||[];
  BWC.ensurePortal(d);
}

const docCategories=['Governing Documents','Architectural Review','Financial / Assessments','Meeting Minutes','Projects','Forms'];
const adminActor='pin-admin';

async function saveAdminChange(action,details,redraw){
  BWC.logAction(workingData,adminActor,action,details||'');
  const synced=await BWC.saveData(workingData);
  if(typeof redraw==='function') redraw();
  if(!synced) console.warn('Saved locally; remote Google Sheets sync did not confirm.');
  return synced;
}

async function confirmDanger(title,message,confirmText='Remove'){
  return BWC.confirmAction({title,message,confirmText,cancelText:'Cancel',danger:true});
}

function pendingRequestCount(type){
  return (workingData.portal.requests||[]).filter(req=>{
    const status=String(req.status||'Submitted');
    return ['Submitted','Pending'].includes(status)&&String(req.type||'').toLowerCase().includes(type);
  }).length;
}

function drawDashboardCounts(){
  const box=document.getElementById('dashboardCounts');
  if(!box) return;
  const pendingResidents=(workingData.portal.residents||[]).filter(r=>r.status==='pending').length;
  box.innerHTML=`
    <div class='dashboard-count'><strong>${pendingResidents}</strong><span>Pending residents</span></div>
    <div class='dashboard-count'><strong>${pendingRequestCount('architectural')}</strong><span>Pending architectural requests</span></div>
    <div class='dashboard-count'><strong>${pendingRequestCount('maintenance')}</strong><span>Pending maintenance requests</span></div>
    <div class='dashboard-count'><strong>${(workingData.portal.bulletins||[]).filter(b=>b.status==='Pending Review').length}</strong><span>Pending bulletins</span></div>
    <div class='dashboard-count'><strong>${(workingData.portal.forumPosts||[]).filter(p=>p.reported).length}</strong><span>Reported forum posts</span></div>
    <div class='dashboard-count'><strong>${(workingData.portal.polls||[]).filter(p=>p.status!=='Archived').length}</strong><span>Active polls</span></div>`;
}

async function handleFileToDataUrl(input,cb){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>cb(r.result,f.name);
  r.readAsDataURL(f);
}

async function render(){
  workingData=await BWC.getData(); ensureDefaults(workingData);
  dash.innerHTML=`
    <div class='card'>
      <h2>Publish Changes</h2>
      <p class='help'>Save regularly while editing. Export creates a backup file.</p>
      <p><a class='buttonlike secondary' href='/resident-portal/'>Open Resident Portal</a></p>
      <div class='grid two'>
        <button id='saveAll'>Save All Changes</button>
        <button id='resetData' class='secondary'>Reload Without Saving</button>
        <button id='exportBtn'>Export Backup (.json)</button>
        <label class='buttonlike secondary'>Import Backup (.json)<input id='importInput' type='file' accept='application/json' hidden></label>
      </div>
    </div>
    <div class='card'><h2>Dashboard Counts</h2><div id='dashboardCounts' class='dashboard-counts'></div></div>
    <div class='card approval-card'><h2>Resident Directory Management</h2><p class='help'>Approve new residents, remove directory listings, or remove resident access entirely.</p><div id='residentApprovals'></div></div>
    <div class='card'><h2>Architectural & Resident Requests</h2><p class='help'>Review submitted requests, update status, and add notes residents can see in their portal.</p><div id='requestReview'></div></div>
    <div class='card'><h2>Forum Moderation</h2><p class='help'>Lock threads, remove reported posts, and keep a moderation audit trail.</p><div id='forumModeration'></div></div>
    <div class='card'><h2>Newsletter & Announcement System</h2><p class='help'>Draft newsletters for opted-in residents. Sending is logged here; external delivery can connect to SendGrid or Mailchimp next.</p><div id='newsletterEditor'></div></div>
    <div class='card'><h2>Polls & Surveys</h2><p class='help'>Create resident polls, surveys, date windows, and result visibility.</p><div id='pollsEditor'></div></div>
    <div class='card'><h2>Digital Bulletin Board</h2><p class='help'>Publish board posts and review resident-submitted posts.</p><div id='bulletinsEditor'></div></div>
    <div class='card'><h2>Portal Document Library</h2><p class='help'>Add resident-only document links by category. File upload can be added once permanent storage is selected.</p><div id='documentsEditor'></div></div>
    <div class='card'><h2>About Page</h2><div id='aboutEditor'></div></div>
    <div class='card'><h2>Portal Upcoming Events</h2><p class='help'>Resident-only event details and RSVPs display inside the Resident Portal.</p><div id='eventsEditor'></div></div>
    <div class='card'><h2>Portal Neighborhood Projects</h2><p class='help'>Resident-only project updates and project documents display inside the Resident Portal.</p><div id='projectsEditor'></div></div>
    <div class='card'><h2>Helpful Resources</h2><div id='resourcesEditor'></div></div>
    <div class='card'><h2>Neighborhood Map Lots</h2><div id='lotsEditor'></div></div>
    <div class='card'><h2>Resident Submissions</h2><p>Contacts: ${workingData.contacts.length} | Subscribers: ${workingData.subscribers.length} | RSVPs: ${workingData.rsvps.length}</p></div>`;

  drawDashboardCounts(); drawAbout(); drawEvents(); drawProjects(); drawResources(); drawLots(); drawDocuments(); drawResidentApprovals(); drawRequests(); drawForumModeration(); drawNewsletters(); drawPolls(); drawBulletins();
  wireGlobalActions();
}

function wireGlobalActions(){
  document.getElementById('saveAll').onclick=async()=>{await saveAdminChange('admin.bulk.save','Manual Save All Changes');alert('All changes saved.');};
  document.getElementById('resetData').onclick=()=>render();
  document.getElementById('exportBtn').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(workingData,null,2)],{type:'application/json'}));
    a.download=`hoa-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  };
  document.getElementById('importInput').onchange=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const text=await file.text();
    try{const parsed=JSON.parse(text); ensureDefaults(parsed); workingData=parsed; BWC.logAction(workingData,adminActor,'admin.backup.imported',file.name); alert('Backup imported. Remember to click Save All Changes.'); renderWithCurrent();}
    catch{alert('That file is not valid JSON.');}
  };
}
function renderWithCurrent(){ drawDashboardCounts(); drawAbout(); drawEvents(); drawProjects(); drawResources(); drawLots(); drawDocuments(); drawResidentApprovals(); drawRequests(); drawForumModeration(); drawNewsletters(); drawPolls(); drawBulletins(); }

function drawAbout(){
  const box=document.getElementById('aboutEditor');
  box.innerHTML=`<h3>Board Members</h3>${workingData.about.boardMembers.map((m,i)=>`<div class='item'><input data-k='role' data-i='${i}' data-g='board' value='${escapeHtml(m.role)}' placeholder='Role'><input data-k='name' data-i='${i}' data-g='board' value='${escapeHtml(m.name)}' placeholder='Name'><textarea data-k='description' data-i='${i}' data-g='board' placeholder='Description'>${escapeHtml(m.description)}</textarea><button class='secondary danger' data-del='board' data-i='${i}'>Remove</button></div>`).join('')}<button id='addBoard'>+ Add Board Member</button><h3>Committees</h3>${workingData.about.committees.map((c,i)=>`<div class='item'><input data-k='name' data-i='${i}' data-g='committee' value='${escapeHtml(c.name)}' placeholder='Committee name'><textarea data-k='description' data-i='${i}' data-g='committee' placeholder='Description'>${escapeHtml(c.description)}</textarea><button class='secondary danger' data-del='committee' data-i='${i}'>Remove</button></div>`).join('')}<button id='addCommittee'>+ Add Committee</button>`;
  box.querySelectorAll('[data-g]').forEach(el=>el.oninput=(e)=>{const {g,i,k}=e.target.dataset; const v=e.target.value; (g==='board'?workingData.about.boardMembers:workingData.about.committees)[+i][k]=v;});
  box.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{const i=+el.dataset.i; if(el.dataset.del==='board'){const row=workingData.about.boardMembers[i]; workingData.about.boardMembers.splice(i,1); await saveAdminChange('admin.board.removed',row?.name||row?.role||'board member',drawAbout);} else {const row=workingData.about.committees[i]; workingData.about.committees.splice(i,1); await saveAdminChange('admin.committee.removed',row?.name||'committee',drawAbout);}});
  document.getElementById('addBoard').onclick=async()=>{workingData.about.boardMembers.push(clone(blank.board));await saveAdminChange('admin.board.added','board member',drawAbout);};
  document.getElementById('addCommittee').onclick=async()=>{workingData.about.committees.push(clone(blank.committee));await saveAdminChange('admin.committee.added','committee',drawAbout);};
}

function drawEvents(){
  const box=document.getElementById('eventsEditor');
  box.innerHTML=workingData.events.map((ev,i)=>`<div class='item'><input value='${escapeHtml(ev.title)}' data-i='${i}' data-k='title' placeholder='Event title'><input type='datetime-local' value='${escapeHtml(ev.datetime||'')}' data-i='${i}' data-k='datetime'><input value='${escapeHtml(ev.location)}' data-i='${i}' data-k='location' placeholder='Location'><textarea data-i='${i}' data-k='description' placeholder='Description'>${escapeHtml(ev.description)}</textarea><input value='${escapeHtml(ev.rsvpLink||'#')}' data-i='${i}' data-k='rsvpLink' placeholder='RSVP link'><label>Event image URL</label><input value='${escapeHtml(ev.image||'')}' data-i='${i}' data-k='image' placeholder='/wp-content/uploads/...'><label class='buttonlike'>Upload Event Image<input type='file' accept='image/*' data-upload='event' data-i='${i}' hidden></label>${ev.image?`<img class='hero' src='${escapeHtml(BWC.normalizeAssetUrl(ev.image))}' alt='Preview'>`:''}<button class='secondary danger' data-del='${i}'>Remove Event</button></div>`).join('')+"<button id='addEvent'>+ Add Event</button>";
  box.querySelectorAll('[data-k]').forEach(el=>el.oninput=(e)=>{workingData.events[+e.target.dataset.i][e.target.dataset.k]=e.target.value;});
  box.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{
    const event=workingData.events[+el.dataset.del];
    if(!event||!await confirmDanger('Delete event',`Delete "${event.title||'this event'}" from the resident portal events list?`,'Delete Event')) return;
    workingData.events.splice(+el.dataset.del,1);
    await saveAdminChange('admin.event.deleted',event.title||event.id,drawEvents);
  });
  box.querySelectorAll('[data-upload="event"]').forEach(el=>el.onchange=()=>handleFileToDataUrl(el,async(result,name)=>{const row=workingData.events[+el.dataset.i];row.image=result; if(!row.title) row.title=name; await saveAdminChange('admin.event.image.uploaded',row.title||name,drawEvents);}));
  document.getElementById('addEvent').onclick=async()=>{const item=clone(blank.event);item.id=uid('evt');workingData.events.push(item);await saveAdminChange('admin.event.added',item.id,drawEvents);};
}

function drawProjects(){
  const box=document.getElementById('projectsEditor');
  box.innerHTML=workingData.projects.map((p,i)=>`<div class='item'><input value='${escapeHtml(p.name)}' data-i='${i}' data-k='name' placeholder='Project name'><select data-i='${i}' data-k='status'><option ${p.status==='Planned'?'selected':''}>Planned</option><option ${p.status==='In Progress'?'selected':''}>In Progress</option><option ${p.status==='Complete'?'selected':''}>Complete</option></select><textarea data-i='${i}' data-k='description' placeholder='Description'>${escapeHtml(p.description)}</textarea><h4>Documents</h4>${(p.documents||[]).map((d,di)=>`<div class='grid two'><input value='${escapeHtml(d.label||'')}' data-i='${i}' data-doc='${di}' data-k='label' placeholder='Document label'><input value='${escapeHtml(d.url||'')}' data-i='${i}' data-doc='${di}' data-k='url' placeholder='Document URL'><button class='secondary danger' data-dropdoc='${i}' data-doc='${di}'>Remove Document</button></div>`).join('')}<label class='buttonlike secondary'>Upload Document<input type='file' data-upload='doc' data-i='${i}' hidden></label><button class='secondary' data-adddoc='${i}'>+ Add Document Link</button><button class='secondary danger' data-delproj='${i}'>Remove Project</button></div>`).join('')+"<button id='addProject'>+ Add Project</button>";
  box.querySelectorAll('[data-k]').forEach(el=>el.oninput=(e)=>{const {i,k,doc}=e.target.dataset; if(doc!==undefined){workingData.projects[+i].documents[+doc][k]=e.target.value;} else {workingData.projects[+i][k]=e.target.value;}});
  box.querySelectorAll('[data-adddoc]').forEach(el=>el.onclick=async()=>{const p=workingData.projects[+el.dataset.adddoc];p.documents=p.documents||[];p.documents.push({label:'',url:''});await saveAdminChange('admin.project.document.added',p.name||p.id,drawProjects);});
  box.querySelectorAll('[data-dropdoc]').forEach(el=>el.onclick=async()=>{
    const p=workingData.projects[+el.dataset.dropdoc];
    const doc=p&&p.documents?p.documents[+el.dataset.doc]:null;
    if(!doc||!await confirmDanger('Remove project document',`Remove "${doc.label||'this document'}" from ${p.name||'this project'}?`,'Remove Document')) return;
    p.documents.splice(+el.dataset.doc,1);
    await saveAdminChange('admin.project.document.removed',`${p.name||p.id}: ${doc.label||doc.url||'document'}`,drawProjects);
  });
  box.querySelectorAll('[data-upload="doc"]').forEach(el=>el.onchange=()=>handleFileToDataUrl(el,async(result,name)=>{const p=workingData.projects[+el.dataset.i];p.documents=p.documents||[];p.documents.push({label:name,url:result});await saveAdminChange('admin.project.document.uploaded',`${p.name||p.id}: ${name}`,drawProjects);}));
  box.querySelectorAll('[data-delproj]').forEach(el=>el.onclick=async()=>{
    const project=workingData.projects[+el.dataset.delproj];
    if(!project||!await confirmDanger('Delete project',`Delete "${project.name||'this project'}" from the resident portal project list?`,'Delete Project')) return;
    workingData.projects.splice(+el.dataset.delproj,1);
    await saveAdminChange('admin.project.deleted',project.name||project.id,drawProjects);
  });
  document.getElementById('addProject').onclick=async()=>{const item=clone(blank.project);item.id=uid('prj');workingData.projects.push(item);await saveAdminChange('admin.project.added',item.id,drawProjects);};
}

function drawDocuments(){
  const box=document.getElementById('documentsEditor');
  const docs=workingData.portal.documents||[];
  const categoryOptions=docCategories.map(category=>`<option value='${escapeHtml(category)}'>${escapeHtml(category)}</option>`).join('');
  box.innerHTML=`
    <div class='doc-admin-form'>
      <div class='grid two doc-admin-row'>
        <input id='docName' placeholder='Document name'>
        <select id='docCategory'>${categoryOptions}</select>
        <input id='docUrl' placeholder='Document URL'>
        <input id='docDescription' placeholder='Short description (optional)'>
      </div>
      <div id='documentMsg' class='form-message' role='status'></div>
      <button id='addPortalDocument'>Add Document Link</button>
      <p class='help'>Upload file storage is planned for the next storage phase. For now, add a Google Drive, PDF, or hosted file URL.</p>
    </div>
    <div class='doc-library'>
      ${docCategories.map(category=>{
        const items=docs.filter(doc=>(doc.category||'Forms')===category);
        return `<section class='doc-category'><h3>${escapeHtml(category)} (${items.length})</h3>${items.map(doc=>`
          <article class='doc-item'>
            <strong>${escapeHtml(doc.name||'Untitled document')}</strong>
            ${doc.description?`<p>${escapeHtml(doc.description)}</p>`:''}
            ${doc.url?`<small>${escapeHtml(doc.url)}</small>`:''}
            <button class='secondary danger' data-del-portal-doc='${escapeHtml(doc.id)}'>Remove Document</button>
          </article>`).join('')||'<p class="help">No documents in this category.</p>'}</section>`;
      }).join('')}
    </div>`;
  document.getElementById('addPortalDocument').onclick=async()=>{
    const name=BWC.sanitize(document.getElementById('docName').value,140);
    const category=document.getElementById('docCategory').value;
    const url=BWC.sanitize(document.getElementById('docUrl').value,500);
    const description=BWC.sanitize(document.getElementById('docDescription').value,240);
    if(!name||!url){setMessage('documentMsg','Add a document name and URL.','error');return;}
    docs.push({id:uid('doc'),name,category,description,url});
    setMessage('documentMsg','Saving document link...','info');
    await saveAdminChange('admin.document.added',`${category}: ${name}`,drawDocuments);
  };
  box.querySelectorAll('[data-del-portal-doc]').forEach(btn=>btn.onclick=async()=>{
    const index=docs.findIndex(doc=>doc.id===btn.dataset.delPortalDoc);
    const doc=docs[index];
    if(index<0||!doc) return;
    if(!await confirmDanger('Remove document',`Remove "${doc.name||'this document'}" from the portal document library?`,'Remove Document')) return;
    docs.splice(index,1);
    await saveAdminChange('admin.document.removed',`${doc.category||'Documents'}: ${doc.name||doc.id}`,drawDocuments);
  });
}

function drawResources(){
  const box=document.getElementById('resourcesEditor');
  box.innerHTML=workingData.resources.map((r,i)=>`<div class='item grid two'><input value='${escapeHtml(r.title)}' data-i='${i}' data-k='title' placeholder='Title'><input value='${escapeHtml(r.url)}' data-i='${i}' data-k='url' placeholder='URL'><button class='secondary danger' data-del='${i}'>Remove</button></div>`).join('')+"<button id='addRes'>+ Add Resource</button>";
  box.querySelectorAll('[data-k]').forEach(el=>el.oninput=(e)=>workingData.resources[+e.target.dataset.i][e.target.dataset.k]=e.target.value);
  box.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{
    const resource=workingData.resources[+el.dataset.del];
    workingData.resources.splice(+el.dataset.del,1);
    await saveAdminChange('admin.resource.removed',resource?.title||resource?.url||'resource',drawResources);
  });
  document.getElementById('addRes').onclick=async()=>{workingData.resources.push(clone(blank.resource));await saveAdminChange('admin.resource.added','resource',drawResources);};
}
function drawLots(){
  const box=document.getElementById('lotsEditor');
  box.innerHTML=workingData.mapLots.map((l,i)=>`<div class='item grid two'><input value='${escapeHtml(l.address)}' data-i='${i}' data-k='address' placeholder='Address'><input value='${escapeHtml(l.lat)}' data-i='${i}' data-k='lat' type='number' step='0.000001' placeholder='Latitude'><input value='${escapeHtml(l.lng)}' data-i='${i}' data-k='lng' type='number' step='0.000001' placeholder='Longitude'><button class='secondary danger' data-del='${i}'>Remove</button></div>`).join('')+"<button id='addLot'>+ Add Lot</button>";
  box.querySelectorAll('[data-k]').forEach(el=>el.oninput=(e)=>{const i=+e.target.dataset.i,k=e.target.dataset.k; workingData.mapLots[i][k]=(k==='lat'||k==='lng')?Number(e.target.value):e.target.value;});
  box.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{
    const lot=workingData.mapLots[+el.dataset.del];
    workingData.mapLots.splice(+el.dataset.del,1);
    await saveAdminChange('admin.lot.removed',lot?.address||lot?.lot||'lot',drawLots);
  });
  document.getElementById('addLot').onclick=async()=>{const lot=clone(blank.mapLot); lot.id=uid('lot'); workingData.mapLots.push(lot);await saveAdminChange('admin.lot.added',lot.id,drawLots);};
}

function drawRequests(){
  const box=document.getElementById('requestReview');
  const requests=workingData.portal.requests||[];
  const statusOptions=['Submitted','Pending','Approved','Denied'];
  box.innerHTML=requests.length?requests.map((req,i)=>`
    <div class='item request-admin-row'>
      <div class='request-admin-head'>
        <strong>#${escapeHtml(req.caseNumber||'Unnumbered')}</strong>
        <span>${escapeHtml(req.type||'Request')}</span>
        <b>${escapeHtml(req.status||'Submitted')}</b>
      </div>
      <p>${escapeHtml(req.description||'No description provided.')}</p>
      <small>${escapeHtml(req.residentName||'Resident')}${req.address?` - ${escapeHtml(req.address)}`:''}${req.lot?` - Lot ${escapeHtml(req.lot)}`:''}${req.parcel?` - Parcel ${escapeHtml(req.parcel)}`:''}</small>
      <div class='request-links'>
        ${req.attachmentName?`<a href='${escapeHtml(req.attachmentUrl||'#')}' target='_blank' rel='noopener noreferrer'>${escapeHtml(req.attachmentName)}</a>`:''}
        ${req.fileLink?`<a href='${escapeHtml(req.fileLink)}' target='_blank' rel='noopener noreferrer'>Linked file</a>`:''}
      </div>
      <div class='grid two'>
        <select data-req-status='${i}'>${statusOptions.map(status=>`<option ${String(req.status||'Submitted')===status?'selected':''}>${status}</option>`).join('')}</select>
        <input data-req-note='${i}' value='${escapeHtml(req.adminNote||'')}' placeholder='Admin note visible to resident'>
      </div>
      <button data-save-req='${i}'>Save Review Status</button>
    </div>`).join(''):'<p class="help">No resident requests have been submitted yet.</p>';
  box.querySelectorAll('[data-save-req]').forEach(btn=>btn.onclick=async()=>{
    const index=Number(btn.dataset.saveReq);
    const req=requests[index];
    if(!req) return;
    req.status=box.querySelector(`[data-req-status="${index}"]`).value;
    req.adminNote=BWC.sanitize(box.querySelector(`[data-req-note="${index}"]`).value,240);
    req.updatedAt=new Date().toISOString();
    await saveAdminChange('request.review',`${req.caseNumber||req.id}: ${req.status}`);
    drawRequests();
    drawDashboardCounts();
    alert('Request status saved.');
  });
}

function drawForumModeration(){
  const box=document.getElementById('forumModeration');
  if(!box) return;
  const categories=workingData.portal.forumCategories||[];
  const threads=workingData.portal.forumThreads||[];
  const posts=workingData.portal.forumPosts||[];
  box.innerHTML=threads.length?threads.map(thread=>{
    const category=categories.find(c=>c.id===thread.categoryId);
    const threadPosts=posts.filter(post=>post.threadId===thread.id&&post.status!=='removed');
    return `<div class='item'><div class='request-admin-head'><strong>${escapeHtml(thread.title)}</strong><span>${escapeHtml(category?.name||'Forum')}</span><b>${thread.locked?'Locked':'Open'}</b></div><small>${threadPosts.length} posts - Started by ${escapeHtml(thread.authorName||'Resident')}</small><button class='secondary' data-lock-thread='${escapeHtml(thread.id)}'>${thread.locked?'Unlock Thread':'Lock Thread'}</button><button class='secondary danger' data-remove-thread='${escapeHtml(thread.id)}'>Remove Thread</button>${threadPosts.map(post=>`<div class='forum-post ${post.reported?'reported':''}'><strong>${escapeHtml(post.authorName||'Resident')}</strong>${post.reported?'<b>Reported</b>':''}<p>${escapeHtml(post.body||'')}</p><button class='secondary danger' data-remove-post='${escapeHtml(post.id)}'>Remove Post</button><button class='secondary' data-clear-report='${escapeHtml(post.id)}'>Clear Report</button></div>`).join('')}</div>`;
  }).join(''):'<p class="help">No forum threads yet.</p>';
  box.querySelectorAll('[data-lock-thread]').forEach(btn=>btn.onclick=async()=>{
    const thread=threads.find(item=>item.id===btn.dataset.lockThread);
    if(!thread) return;
    thread.locked=!thread.locked;
    await saveAdminChange('admin.forum.thread.lock',`${thread.title}: ${thread.locked?'locked':'unlocked'}`,drawForumModeration);
  });
  box.querySelectorAll('[data-remove-thread]').forEach(btn=>btn.onclick=async()=>{
    const thread=threads.find(item=>item.id===btn.dataset.removeThread);
    if(!thread||!await confirmDanger('Remove forum thread',`Remove "${thread.title}" and hide its posts?`,'Remove Thread')) return;
    thread.status='removed';
    posts.filter(post=>post.threadId===thread.id).forEach(post=>post.status='removed');
    await saveAdminChange('admin.forum.thread.removed',thread.title,drawForumModeration);
  });
  box.querySelectorAll('[data-remove-post]').forEach(btn=>btn.onclick=async()=>{
    const post=posts.find(item=>item.id===btn.dataset.removePost);
    if(!post||!await confirmDanger('Remove forum post','Remove this forum post from resident view?','Remove Post')) return;
    post.status='removed';
    post.reported=false;
    await saveAdminChange('admin.forum.post.removed',post.id,drawForumModeration);
  });
  box.querySelectorAll('[data-clear-report]').forEach(btn=>btn.onclick=async()=>{
    const post=posts.find(item=>item.id===btn.dataset.clearReport);
    if(!post) return;
    post.reported=false;
    await saveAdminChange('admin.forum.report.cleared',post.id,drawForumModeration);
  });
}

function drawNewsletters(){
  const box=document.getElementById('newsletterEditor');
  if(!box) return;
  const newsletters=workingData.portal.newsletters||[];
  const recipients=(workingData.portal.residents||[]).filter(r=>r.status==='active'&&r.email&&r.notificationPreferences?.newsletters!==false);
  box.innerHTML=`<div class='doc-admin-form'><input id='newsletterSubject' placeholder='Newsletter subject'><textarea id='newsletterBody' placeholder='Newsletter body'></textarea><div class='grid two'><input id='newsletterSendAt' type='datetime-local'><input id='newsletterExpiresAt' type='date'></div><input id='newsletterAttachmentUrl' placeholder='Optional attachment URL'><button id='saveNewsletterDraft'>Save Draft</button><button id='sendNewsletterNow'>Send / Publish Now</button><p class='help'>Estimated opted-in recipients: ${recipients.length}. External email delivery is queued for provider integration; this logs the send and publishes the archive item.</p></div>${newsletters.map(n=>`<div class='item'><strong>${escapeHtml(n.subject||'Newsletter')}</strong><br><small>${escapeHtml(n.status||'Draft')} - ${escapeHtml((n.sentAt||n.sendAt||n.createdAt||'').slice(0,16).replace('T',' '))} - ${Number(n.recipientCount||0)} recipients</small><p>${escapeHtml(n.body||'')}</p><button class='secondary danger' data-remove-newsletter='${escapeHtml(n.id)}'>Remove Newsletter</button></div>`).join('')||'<p class="help">No newsletters yet.</p>'}`;
  const buildNewsletter=(status)=>({id:uid('nl'),subject:BWC.sanitize(document.getElementById('newsletterSubject').value,180),body:BWC.sanitize(document.getElementById('newsletterBody').value,4000),attachmentName:'',attachmentUrl:BWC.sanitize(document.getElementById('newsletterAttachmentUrl').value,500),status,sendAt:document.getElementById('newsletterSendAt').value,sentAt:status==='Published'?new Date().toISOString():'',expiresAt:document.getElementById('newsletterExpiresAt').value,recipientCount:status==='Published'?recipients.length:0,createdAt:new Date().toISOString()});
  document.getElementById('saveNewsletterDraft').onclick=async()=>{
    const newsletter=buildNewsletter('Draft');
    if(!newsletter.subject||!newsletter.body) return alert('Add a subject and body.');
    newsletters.unshift(newsletter);
    await saveAdminChange('admin.newsletter.draft',newsletter.subject,drawNewsletters);
  };
  document.getElementById('sendNewsletterNow').onclick=async()=>{
    const newsletter=buildNewsletter('Published');
    if(!newsletter.subject||!newsletter.body) return alert('Add a subject and body.');
    newsletters.unshift(newsletter);
    recipients.forEach(r=>workingData.portal.notifications.unshift({id:uid('ntf'),type:'newsletter',residentId:r.id,email:r.email,subject:newsletter.subject,message:'Newsletter queued for email delivery.',status:'queued',createdAt:new Date().toISOString()}));
    await saveAdminChange('admin.newsletter.sent',`${newsletter.subject}: ${recipients.length} recipients`,drawNewsletters);
  };
  box.querySelectorAll('[data-remove-newsletter]').forEach(btn=>btn.onclick=async()=>{
    const index=newsletters.findIndex(n=>n.id===btn.dataset.removeNewsletter);
    const newsletter=newsletters[index];
    if(index<0||!await confirmDanger('Remove newsletter',`Remove "${newsletter.subject||'this newsletter'}" from the archive?`,'Remove Newsletter')) return;
    newsletters.splice(index,1);
    await saveAdminChange('admin.newsletter.removed',newsletter.subject||newsletter.id,drawNewsletters);
  });
}

function drawPolls(){
  const box=document.getElementById('pollsEditor');
  if(!box) return;
  const polls=workingData.portal.polls||[];
  const responses=workingData.portal.pollResponses||[];
  box.innerHTML=`<div class='doc-admin-form'><input id='pollQuestion' placeholder='Poll or survey question'><select id='pollAnswerType'><option value='single'>Single choice</option><option value='multiple'>Multiple choice</option><option value='free-text'>Free text survey</option></select><textarea id='pollOptions' placeholder='Options, one per line. Leave blank for free-text surveys.'></textarea><div class='grid two'><input id='pollStartDate' type='date'><input id='pollEndDate' type='date'></div><label class='inline-check'><input id='pollAnonymous' type='checkbox'> Store responses anonymously</label><label class='inline-check'><input id='pollShowResults' type='checkbox' checked> Show results to residents</label><button id='addPoll'>Create Poll / Survey</button></div>${polls.map(poll=>`<div class='item'><strong>${escapeHtml(poll.question)}</strong><br><small>${escapeHtml(poll.answerType||'single')} - ${escapeHtml(poll.startDate||'')} to ${escapeHtml(poll.endDate||'')} - ${responses.filter(r=>r.pollId===poll.id).length} responses</small><div class='grid two'><select data-poll-status='${escapeHtml(poll.id)}'><option ${poll.status==='Open'?'selected':''}>Open</option><option ${poll.status==='Closed'?'selected':''}>Closed</option><option ${poll.status==='Archived'?'selected':''}>Archived</option></select><button data-save-poll-status='${escapeHtml(poll.id)}'>Save Status</button></div><button class='secondary danger' data-remove-poll='${escapeHtml(poll.id)}'>Remove Poll</button></div>`).join('')||'<p class="help">No polls have been created yet.</p>'}`;
  document.getElementById('addPoll').onclick=async()=>{
    const question=BWC.sanitize(document.getElementById('pollQuestion').value,220);
    const answerType=document.getElementById('pollAnswerType').value;
    const options=document.getElementById('pollOptions').value.split('\n').map(option=>BWC.sanitize(option,120)).filter(Boolean);
    if(!question) return alert('Add a poll question.');
    if(answerType!=='free-text'&&options.length<2) return alert('Add at least two answer options.');
    polls.unshift({id:uid('poll'),question,answerType,options,startDate:document.getElementById('pollStartDate').value,endDate:document.getElementById('pollEndDate').value,anonymous:document.getElementById('pollAnonymous').checked,showResults:document.getElementById('pollShowResults').checked,status:'Open',createdAt:new Date().toISOString()});
    await saveAdminChange('admin.poll.created',question,drawPolls);
  };
  box.querySelectorAll('[data-save-poll-status]').forEach(btn=>btn.onclick=async()=>{
    const poll=polls.find(p=>p.id===btn.dataset.savePollStatus);
    if(!poll) return;
    poll.status=box.querySelector(`[data-poll-status="${poll.id}"]`).value;
    await saveAdminChange('admin.poll.status',`${poll.question}: ${poll.status}`,drawPolls);
  });
  box.querySelectorAll('[data-remove-poll]').forEach(btn=>btn.onclick=async()=>{
    const index=polls.findIndex(p=>p.id===btn.dataset.removePoll);
    const poll=polls[index];
    if(index<0||!await confirmDanger('Remove poll',`Remove "${poll.question}" and its responses?`,'Remove Poll')) return;
    polls.splice(index,1);
    workingData.portal.pollResponses=(workingData.portal.pollResponses||[]).filter(response=>response.pollId!==poll.id);
    await saveAdminChange('admin.poll.removed',poll.question,drawPolls);
  });
}

function drawBulletins(){
  const box=document.getElementById('bulletinsEditor');
  if(!box) return;
  const bulletins=workingData.portal.bulletins||[];
  const categories=['Announcements','Reminders','Lost & Found','For Sale','Social'];
  const categoryOptions=categories.map(category=>`<option>${escapeHtml(category)}</option>`).join('');
  box.innerHTML=`<div class='doc-admin-form'><input id='bulletinTitle' placeholder='Bulletin title'><select id='bulletinCategory'>${categoryOptions}</select><textarea id='bulletinBody' placeholder='Bulletin body'></textarea><div class='grid two'><input id='bulletinStartDate' type='date'><input id='bulletinExpiresAt' type='date'></div><input id='bulletinAttachmentUrl' placeholder='Optional attachment URL'><button id='addBulletin'>Publish Bulletin</button></div>${bulletins.map(b=>`<div class='item'><div class='request-admin-head'><strong>${escapeHtml(b.title)}</strong><span>${escapeHtml(b.category||'Announcements')}</span><b>${escapeHtml(b.status||'Published')}</b></div><small>${escapeHtml(b.startDate||'')} to ${escapeHtml(b.expiresAt||'No expiry')} - ${escapeHtml(b.authorName||'Admin')}</small><p>${escapeHtml(b.body||'')}</p><button data-publish-bulletin='${escapeHtml(b.id)}'>Publish</button><button class='secondary' data-reject-bulletin='${escapeHtml(b.id)}'>Reject</button><button class='secondary danger' data-remove-bulletin='${escapeHtml(b.id)}'>Remove</button></div>`).join('')||'<p class="help">No bulletin board posts yet.</p>'}`;
  document.getElementById('addBulletin').onclick=async()=>{
    const title=BWC.sanitize(document.getElementById('bulletinTitle').value,140);
    const body=BWC.sanitize(document.getElementById('bulletinBody').value,1600);
    if(!title||!body) return alert('Add a title and body.');
    const bulletin={id:uid('blt'),title,category:document.getElementById('bulletinCategory').value,body,authorId:adminActor,authorName:'HOA Board',status:'Published',startDate:document.getElementById('bulletinStartDate').value||new Date().toISOString().slice(0,10),expiresAt:document.getElementById('bulletinExpiresAt').value,attachmentName:'',attachmentUrl:BWC.sanitize(document.getElementById('bulletinAttachmentUrl').value,500),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    bulletins.unshift(bulletin);
    (workingData.portal.residents||[]).filter(r=>r.status==='active'&&r.email&&r.notificationPreferences?.bulletins!==false).forEach(r=>workingData.portal.notifications.unshift({id:uid('ntf'),type:'bulletin',residentId:r.id,email:r.email,subject:bulletin.title,message:'New bulletin board post queued for notification.',status:'queued',createdAt:new Date().toISOString()}));
    await saveAdminChange('admin.bulletin.published',title,drawBulletins);
  };
  box.querySelectorAll('[data-publish-bulletin]').forEach(btn=>btn.onclick=async()=>{const bulletin=bulletins.find(b=>b.id===btn.dataset.publishBulletin); if(!bulletin) return; bulletin.status='Published'; bulletin.updatedAt=new Date().toISOString(); await saveAdminChange('admin.bulletin.approved',bulletin.title,drawBulletins); drawDashboardCounts();});
  box.querySelectorAll('[data-reject-bulletin]').forEach(btn=>btn.onclick=async()=>{const bulletin=bulletins.find(b=>b.id===btn.dataset.rejectBulletin); if(!bulletin) return; bulletin.status='Rejected'; bulletin.updatedAt=new Date().toISOString(); await saveAdminChange('admin.bulletin.rejected',bulletin.title,drawBulletins); drawDashboardCounts();});
  box.querySelectorAll('[data-remove-bulletin]').forEach(btn=>btn.onclick=async()=>{const index=bulletins.findIndex(b=>b.id===btn.dataset.removeBulletin); const bulletin=bulletins[index]; if(index<0||!await confirmDanger('Remove bulletin',`Remove "${bulletin.title}"?`,'Remove Bulletin')) return; bulletins.splice(index,1); await saveAdminChange('admin.bulletin.removed',bulletin.title,drawBulletins); drawDashboardCounts();});
}

function drawResidentApprovals(){
  const box=document.getElementById('residentApprovals');
  BWC.normalizeResidents(workingData);
  const residents=workingData.portal.residents||[];
  const pending=residents.filter(r=>r.status==='pending');
  const active=residents.filter(r=>r.status==='active');
  const suspended=residents.filter(r=>r.status==='suspended');
  const contactsText=(r)=>BWC.normalizeHouseholdContacts(r).map(c=>[c.name,c.phone,c.email].filter(Boolean).join(' - ')).join('<br>')||'No household contacts listed';
  const rowCard=(r,actions='')=>`<div class='item resident-admin-row'><strong>${escapeHtml(r.name)}</strong><br>${escapeHtml(r.address||'No address')}<br><small>${escapeHtml(r.email)}${r.phone?` - ${escapeHtml(r.phone)}`:''}${r.lot?` - Lot ${escapeHtml(r.lot)}`:''}${r.parcel?` - Parcel ${escapeHtml(r.parcel)}`:''} - Directory: ${r.directoryOptIn?'Yes':'No'}</small><div class='household-contact-list'>${contactsText(r)}</div>${actions}${r.role==='admin'?'':`<button data-remove-res='${escapeHtml(r.id)}' class='secondary danger'>Remove Resident</button>`}</div>`;
  box.innerHTML=`
    <h3>Pending Approval (${pending.length})</h3>
    ${pending.map(r=>rowCard(r,`<button data-approve-res='${escapeHtml(r.id)}'>Approve${r.directoryOptIn?' & Add to Directory':''}</button><button data-suspend-res='${escapeHtml(r.id)}' class='secondary danger'>Suspend</button>`)).join('')||'<p class="help">No pending resident approvals.</p>'}
    <h3>Master Directory Entries (${active.filter(r=>r.directoryOptIn).length})</h3>
    ${active.filter(r=>r.directoryOptIn).map(r=>rowCard(r,`<button data-optout-res='${escapeHtml(r.id)}' class='secondary'>Remove From Directory Only</button>`)).join('')||'<p class="help">No approved residents have opted into the directory yet.</p>'}
    <h3>Approved Non-Directory Residents (${active.filter(r=>!r.directoryOptIn).length})</h3>
    ${active.filter(r=>!r.directoryOptIn).map(r=>rowCard(r,`<button data-optin-res='${escapeHtml(r.id)}' class='secondary'>Add To Directory</button>`)).join('')||'<p class="help">None.</p>'}
    <h3>Suspended Residents (${suspended.length})</h3>
    ${suspended.map(r=>rowCard(r,`<button data-approve-res='${escapeHtml(r.id)}'>Reactivate</button>`)).join('')||'<p class="help">None.</p>'}`;
  box.querySelectorAll('[data-approve-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.approveRes); if(row){row.status='active'; await saveAdminChange('admin.approve',row.email); drawResidentApprovals(); drawDashboardCounts(); alert('Resident approved.');}});
  box.querySelectorAll('[data-suspend-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.suspendRes); if(row){row.status='suspended'; await saveAdminChange('admin.suspend',row.email); drawResidentApprovals(); drawDashboardCounts(); alert('Resident suspended.');}});
  box.querySelectorAll('[data-optout-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.optoutRes); if(row){row.directoryOptIn=false; await saveAdminChange('admin.directory.optout',row.email); drawResidentApprovals(); alert('Resident removed from directory but access remains active.');}});
  box.querySelectorAll('[data-optin-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.optinRes); if(row){row.directoryOptIn=true; await saveAdminChange('admin.directory.optin',row.email); drawResidentApprovals(); alert('Resident added to directory.');}});
  box.querySelectorAll('[data-remove-res]').forEach(btn=>btn.onclick=async()=>{
    const row=residents.find(r=>r.id===btn.dataset.removeRes);
    if(!row) return;
    if(!await confirmDanger('Remove resident',`Remove ${row.name || row.email} from resident access and the directory? This cannot be undone from this screen.`,'Remove Resident')) return;
    BWC.removeResidentFromData(workingData,row.id,'pin-admin');
    await BWC.saveData(workingData);
    drawResidentApprovals();
    drawDashboardCounts();
    alert('Resident removed.');
  });
}

document.getElementById('login').onclick=async()=>{if(document.getElementById('pin').value!==BWC.defaultPin){setMessage('adminLoginMsg','Invalid PIN. Please try again.','error');return;}setMessage('adminLoginMsg','Opening admin dashboard...','success');auth.style.display='none';dash.style.display='block';render();};
BWC.wireSiteNav();
</script></body></html>
