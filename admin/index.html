</nav><div class='container admin-login-wrap'><h1>Admin Portal</h1><p class='help'>Board workspace for resident approvals, portal content, requests, documents, communications, and map data.</p><div id='auth' class='card'><p>Enter admin PIN</p><div id='adminLoginMsg' class='form-message' role='status'></div><input id='pin' type='password'><button id='login'>Login</button></div></div><div id='dash' class='admin-shell' style='display:none'></div><script src='/assets/hoa-app.js'></script><script>
const auth=document.getElementById('auth'),dash=document.getElementById('dash');
let workingData=null;
let currentAdminModule='dashboard';

const blank={
  board:{role:'',name:'',description:''},
  committee:{name:'',description:''},
  event:{id:'',title:'',datetime:'',location:'',description:'',image:'',rsvpLink:'#'},
  project:{id:'',name:'',status:'Planned',description:'',documents:[]},
  document:{id:'',name:'',category:'Forms',description:'',url:''},
  resource:{title:'',url:''},
  mapLot:{id:'',address:'',lat:'',lng:''}
};

function uid(prefix){return `${prefix}-${Date.now()}-${Math.floor(Math.random()*1000)}`;}
function escapeHtml(str=''){return String(str).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function clone(v){return JSON.parse(JSON.stringify(v));}
function setMessage(id,text,type='error'){const el=document.getElementById(id); if(!el) return; el.textContent=text||''; el.className=`form-message ${type} ${text?'show':''}`;}
function ensureDefaults(d){
  d.about=d.about||{boardMembers:[],committees:[]};
  d.about.boardMembers=d.about.boardMembers||[];
  d.about.committees=d.about.committees||[];
  d.events=d.events||[]; d.projects=d.projects||[]; d.resources=d.resources||[]; d.mapLots=d.mapLots||[];
  d.contacts=d.contacts||[]; d.subscribers=d.subscribers||[]; d.rsvps=d.rsvps||[];
  BWC.ensurePortal(d);
}

const docCategories=['Governing Documents','Architectural Review','Financial / Assessments','Meeting Minutes','Projects','Forms'];
const adminActor='pin-admin';
const adminNavItems=[
  ['dashboard','Dashboard','&#8962;'],
  ['residents','Residents','&#9783;'],
  ['directory','Directory','&#9638;'],
  ['requests','Requests','&#9776;'],
  ['events','Events','&#9635;'],
  ['projects','Projects','&#9874;'],
  ['documents','Documents','&#128449;'],
  ['communications','Communications','&#9993;'],
  ['map-lots','Map Lots','&#9678;'],
  ['settings','Settings','&#9881;']
];

async function saveAdminChange(action,details,redraw){
  BWC.logAction(workingData,adminActor,action,details||'');
  const synced=await BWC.saveData(workingData);
  if(typeof redraw==='function') redraw();
  if(!synced) console.warn('Saved locally; remote Google Sheets sync did not confirm.');
  return synced;
}

function adminStatus(state='saved',text='Saved'){
  return `<span class='save-chip ${state}' data-save-chip>${escapeHtml(text)}</span>`;
}
function setCardStatus(card,state,text){
  const chip=card&&card.querySelector('[data-save-chip]');
  if(!chip) return;
  chip.className=`save-chip ${state}`;
  chip.textContent=text;
}
function markDirtyFromInputs(scope){
  scope.querySelectorAll('input,textarea,select').forEach(input=>{
    if(input.type==='file') return;
    input.addEventListener('input',()=>setCardStatus(input.closest('.admin-record-card,.admin-edit-row,.doc-admin-form'),'unsaved','Unsaved changes'));
    input.addEventListener('change',()=>setCardStatus(input.closest('.admin-record-card,.admin-edit-row,.doc-admin-form'),'unsaved','Unsaved changes'));
  });
}
async function saveFromButton(button,action,details,redraw){
  const card=button.closest('.admin-record-card,.admin-edit-row,.doc-admin-form,.item');
  setCardStatus(card,'saving','Saving...');
  const synced=await saveAdminChange(action,details,redraw);
  if(!redraw) setCardStatus(card,synced?'saved':'failed',synced?'Saved':'Save failed');
  return synced;
}

async function confirmDanger(title,message,confirmText='Remove'){
  return BWC.confirmAction({title,message,confirmText,cancelText:'Cancel',danger:true});
}

function pendingRequestCount(type){
  return (workingData.portal.requests||[]).filter(req=>{
    const status=String(req.status||'Submitted');
    return ['Submitted','Pending'].includes(status)&&String(req.type||'').toLowerCase().includes(type);
  }).length;
}

function drawDashboardCounts(){
  const box=document.getElementById('dashboardCounts');
  if(!box) return;
  const pendingResidents=(workingData.portal.residents||[]).filter(r=>r.status==='pending').length;
  box.innerHTML=`
    <button class='dashboard-count' data-jump='residents'><strong>${pendingResidents}</strong><span>Pending residents</span></button>
    <button class='dashboard-count' data-jump='requests'><strong>${pendingRequestCount('architectural')}</strong><span>Pending architectural requests</span></button>
    <button class='dashboard-count' data-jump='requests'><strong>${pendingRequestCount('maintenance')}</strong><span>Pending maintenance requests</span></button>
    <button class='dashboard-count' data-jump='communications'><strong>${(workingData.portal.bulletins||[]).filter(b=>b.status==='Pending Review').length}</strong><span>Pending bulletins</span></button>
    <button class='dashboard-count' data-jump='communications'><strong>${(workingData.portal.forumPosts||[]).filter(p=>p.reported).length}</strong><span>Reported forum posts</span></button>
    <button class='dashboard-count' data-jump='communications'><strong>${(workingData.portal.polls||[]).filter(p=>p.status!=='Archived').length}</strong><span>Active polls</span></button>`;
  box.querySelectorAll('[data-jump]').forEach(button=>button.onclick=()=>switchAdminModule(button.dataset.jump));
}

async function handleFileToDataUrl(input,cb){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>cb(r.result,f.name);
  r.readAsDataURL(f);
}

async function render(){
  workingData=await BWC.getData(); ensureDefaults(workingData);
  dash.innerHTML=`
    <aside class='admin-sidebar' aria-label='Admin workspace navigation'>
      <div class='admin-logo-mark' aria-hidden='true'>BC</div>
      <div class='admin-brand'><strong>Bentwood Creek</strong><span>HOA Portal</span></div>
      <button id='adminMenuToggle' class='secondary admin-menu-toggle' type='button'>Menu</button>
      <nav id='adminNav'>${adminNavItems.map(([id,label,icon])=>`<button type='button' class='admin-nav-link ${id===currentAdminModule?'active':''}' data-admin-module='${id}'><span class='admin-nav-icon'>${icon}</span><span>${label}</span></button>`).join('')}</nav>
    </aside>
    <main class='admin-main'>
      <header class='admin-app-header'>
        <div><h1>Bentwood Creek HOA Portal</h1><p>Admin workspace</p></div>
        <div class='admin-header-actions'><span class='admin-notice-bell' aria-label='Notifications'>!</span><span class='role-pill'>Admin User<br><small>Board Admin</small></span><button id='adminLogout' class='secondary' type='button'>Logout</button></div>
      </header>
      <section id='module-dashboard' class='admin-module'><div class='admin-section-head'><div><h2>Better Add/Edit Experience</h2><p class='help'>What needs attention today.</p></div></div><div class='admin-info-banner'>Each section saves independently. Each card or row has its own save action.</div><div id='dashboardCounts' class='dashboard-counts clickable-counts'></div><div class='admin-dashboard-grid'><div class='card'><h3>Quick Actions</h3><div class='quick-actions'><button data-jump='communications'>Add Announcement</button><button data-jump='events'>Add Event</button><button data-jump='documents'>Add Document</button><button data-jump='communications'>Publish Bulletin</button><button data-jump='communications'>Create Poll</button><button data-jump='residents'>Review Pending Resident</button></div></div><div class='card'><h3>Recent Activity</h3><div id='recentActivity'></div></div></div></section>
      <section id='module-residents' class='admin-module'><div class='admin-section-head'><div><h2>Residents</h2><p class='help'>Approve access, manage account status, and review household details.</p></div><input id='residentSearch' type='search' placeholder='Search name, address, email, or lot'></div><div id='residentApprovals'></div></section>
      <section id='module-directory' class='admin-module'><div class='admin-section-head'><div><h2>Directory</h2><p class='help'>Manage who appears in the resident directory.</p></div></div><div id='directoryManagement'></div></section>
      <section id='module-requests' class='admin-module'><div class='admin-section-head'><div><h2>Requests</h2><p class='help'>Review architectural, maintenance, and resident requests.</p></div><select id='requestFilter'><option value='all'>All requests</option><option>Architectural Change</option><option>Maintenance</option><option>Submitted</option><option>Pending</option><option>Approved</option><option>Denied</option></select></div><div id='requestReview'></div></section>
      <section id='module-events' class='admin-module'><div class='admin-section-head'><div><h2>Events</h2><p class='help'>Each event saves independently.</p></div><button id='addEvent'>+ Add Event</button></div><div id='eventsEditor'></div></section>
      <section id='module-projects' class='admin-module'><div class='admin-section-head'><div><h2>Projects</h2><p class='help'>Project cards include related document links.</p></div><button id='addProject'>+ Add Project</button></div><div id='projectsEditor'></div></section>
      <section id='module-documents' class='admin-module'><div class='admin-section-head'><div><h2>Documents</h2><p class='help'>Resident-only documents saved through the existing backend.</p></div></div><div id='documentsEditor'></div></section>
      <section id='module-communications' class='admin-module'><div class='admin-section-head'><div><h2>Communications</h2><p class='help'>Newsletters, polls, bulletins, forum moderation, board members, committees, and helpful resources.</p></div></div><div class='admin-subgrid'><div class='card'><h3>1. Board Members & Committees</h3><p class='help'>Edit one public content card at a time.</p><div id='aboutEditor'></div></div><div class='card'><h3>2. Newsletter & Announcement System</h3><p class='help'>Draft, schedule, or publish resident updates.</p><div id='newsletterEditor'></div></div><div class='card'><h3>3. Polls & Surveys</h3><p class='help'>Create resident polls with clear response windows.</p><div id='pollsEditor'></div></div><div class='card'><h3>4. Digital Bulletin Board</h3><p class='help'>Publish board posts and review submissions.</p><div id='bulletinsEditor'></div></div><div class='card'><h3>5. Forum Moderation</h3><p class='help'>Review reports, lock threads, or remove posts.</p><div id='forumModeration'></div></div><div class='card'><h3>6. Helpful Resources</h3><p class='help'>Maintain public-safe links.</p><div id='resourcesEditor'></div></div></div></section>
      <section id='module-map-lots' class='admin-module'><div class='admin-section-head'><div><h2>Map Lots</h2><p class='help'>Search and maintain parcel data used by the neighborhood map.</p></div><input id='lotSearchAdmin' type='search' placeholder='Search lot or address'></div><div id='lotsEditor'></div></section>
      <section id='module-settings' class='admin-module'><div class='admin-section-head'><div><h2>Settings / Backup</h2><p class='help'>Export or import the current Google Sheets-backed data set.</p></div></div><div class='card'><div class='grid two'><button id='resetData' class='secondary'>Reload From Backend</button><button id='exportBtn'>Export Backup (.json)</button><label class='buttonlike secondary'>Import Backup (.json)<input id='importInput' type='file' accept='application/json' hidden></label><a class='buttonlike secondary' href='/resident-portal/'>Open Resident Portal</a></div><p id='settingsStatus' class='help'>Record edits save in their own sections. There is no separate Save All step.</p></div><div class='card'><h3>Resident Submissions</h3><p>Contacts: ${workingData.contacts.length} | Subscribers: ${workingData.subscribers.length} | RSVPs: ${workingData.rsvps.length}</p></div></section>
    </main>`;

  drawDashboardCounts(); drawAbout(); drawEvents(); drawProjects(); drawResources(); drawLots(); drawDocuments(); drawResidentApprovals(); drawRequests(); drawForumModeration(); drawNewsletters(); drawPolls(); drawBulletins();
  drawRecentActivity();
  switchAdminModule(currentAdminModule,false);
  wireAdminShell();
  wireGlobalActions();
}

function wireGlobalActions(){
  document.getElementById('resetData').onclick=()=>render();
  document.getElementById('exportBtn').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(workingData,null,2)],{type:'application/json'}));
    a.download=`hoa-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  };
  document.getElementById('importInput').onchange=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const text=await file.text();
    try{const parsed=JSON.parse(text); ensureDefaults(parsed); workingData=parsed; BWC.logAction(workingData,adminActor,'admin.backup.imported',file.name); await BWC.saveData(workingData); alert('Backup imported and saved.'); render();}
    catch{alert('That file is not valid JSON.');}
  };
}
function renderWithCurrent(){ drawDashboardCounts(); drawAbout(); drawEvents(); drawProjects(); drawResources(); drawLots(); drawDocuments(); drawResidentApprovals(); drawRequests(); drawForumModeration(); drawNewsletters(); drawPolls(); drawBulletins(); }

function switchAdminModule(id,updateHash=true){
  currentAdminModule=adminNavItems.some(([key])=>key===id)?id:'dashboard';
  document.querySelectorAll('.admin-module').forEach(module=>module.classList.toggle('active',module.id===`module-${currentAdminModule}`));
  document.querySelectorAll('[data-admin-module]').forEach(button=>button.classList.toggle('active',button.dataset.adminModule===currentAdminModule));
  if(updateHash&&location.hash!==`#${currentAdminModule}`) history.replaceState(null,'',`#${currentAdminModule}`);
}
function wireAdminShell(){
  document.querySelectorAll('[data-admin-module]').forEach(button=>button.onclick=()=>switchAdminModule(button.dataset.adminModule));
  document.querySelectorAll('[data-jump]').forEach(button=>button.onclick=()=>switchAdminModule(button.dataset.jump));
  document.getElementById('adminLogout').onclick=()=>{dash.style.display='none';auth.style.display='block';document.querySelector('.admin-login-wrap').style.display='block';};
  document.getElementById('adminMenuToggle').onclick=()=>dash.classList.toggle('nav-open');
  const hash=location.hash.replace('#','');
  if(hash) switchAdminModule(hash,false);
}
function drawRecentActivity(){
  const box=document.getElementById('recentActivity');
  if(!box) return;
  const logs=(workingData.portal.auditLogs||[]).slice(0,8);
  box.innerHTML=logs.length?`<ul class='activity-list'>${logs.map(log=>`<li><strong>${escapeHtml(log.action)}</strong><span>${escapeHtml(log.details||'')}</span><small>${escapeHtml((log.timestamp||'').slice(0,16).replace('T',' '))}</small></li>`).join('')}</ul>`:'<p class="help">No recent activity yet.</p>';
}

function drawAbout(){
  const box=document.getElementById('aboutEditor');
  box.innerHTML=`<div class='about-admin-grid'><section><div class='mini-section-head'><h4>Board Members</h4><button id='addBoard' type='button'>+ Add Board Member</button></div>${workingData.about.boardMembers.map((m,i)=>`<article class='admin-record-card'><div class='record-card-head'><strong>${escapeHtml(m.role||'Board Member')}</strong>${adminStatus()}</div><input data-k='role' data-i='${i}' data-g='board' value='${escapeHtml(m.role)}' placeholder='Role / title'><input data-k='name' data-i='${i}' data-g='board' value='${escapeHtml(m.name)}' placeholder='Name'><textarea data-k='description' data-i='${i}' data-g='board' placeholder='Short biography or responsibility'>${escapeHtml(m.description)}</textarea><div class='record-actions'><button data-save='board' data-i='${i}'>Save Member</button><button class='secondary' data-cancel-record>Cancel</button><button class='secondary danger' data-del='board' data-i='${i}'>Remove</button></div></article>`).join('')||'<p class="help">No board members yet.</p>'}</section><section><div class='mini-section-head'><h4>Committees</h4><button id='addCommittee' type='button'>+ Add Committee</button></div>${workingData.about.committees.map((c,i)=>`<article class='admin-record-card'><div class='record-card-head'><strong>${escapeHtml(c.name||'Committee')}</strong>${adminStatus()}</div><input data-k='name' data-i='${i}' data-g='committee' value='${escapeHtml(c.name)}' placeholder='Committee name'><textarea data-k='description' data-i='${i}' data-g='committee' placeholder='Description'>${escapeHtml(c.description)}</textarea><div class='record-actions'><button data-save='committee' data-i='${i}'>Save Committee</button><button class='secondary' data-cancel-record>Cancel</button><button class='secondary danger' data-del='committee' data-i='${i}'>Remove</button></div></article>`).join('')||'<p class="help">No committees yet.</p>'}</section></div>`;
  box.querySelectorAll('[data-g]').forEach(el=>el.oninput=(e)=>{const {g,i,k}=e.target.dataset; const v=e.target.value; (g==='board'?workingData.about.boardMembers:workingData.about.committees)[+i][k]=v;});
  markDirtyFromInputs(box);
  box.querySelectorAll('[data-save]').forEach(el=>el.onclick=async()=>{const i=+el.dataset.i; const type=el.dataset.save; const row=type==='board'?workingData.about.boardMembers[i]:workingData.about.committees[i]; await saveFromButton(el,`admin.${type}.saved`,row?.name||row?.role||type,drawAbout);});
  box.querySelectorAll('[data-cancel-record]').forEach(el=>el.onclick=()=>render());
  box.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{const i=+el.dataset.i; if(el.dataset.del==='board'){const row=workingData.about.boardMembers[i]; workingData.about.boardMembers.splice(i,1); await saveAdminChange('admin.board.removed',row?.name||row?.role||'board member',drawAbout);} else {const row=workingData.about.committees[i]; workingData.about.committees.splice(i,1); await saveAdminChange('admin.committee.removed',row?.name||'committee',drawAbout);}});
  document.getElementById('addBoard').onclick=()=>{workingData.about.boardMembers.unshift(clone(blank.board));drawAbout(); const first=box.querySelector('.admin-record-card'); if(first) setCardStatus(first,'unsaved','Unsaved changes');};
  document.getElementById('addCommittee').onclick=()=>{workingData.about.committees.unshift(clone(blank.committee));drawAbout(); const first=box.querySelectorAll('.admin-record-card')[workingData.about.boardMembers.length]; if(first) setCardStatus(first,'unsaved','Unsaved changes');};
}

function drawEvents(){
  const box=document.getElementById('eventsEditor');
  box.innerHTML=workingData.events.map((ev,i)=>`<article class='admin-record-card event-card'><div class='record-card-head'><strong>${escapeHtml(ev.title||'New Event')}</strong>${adminStatus()}</div>${ev.image?`<img class='admin-thumb' src='${escapeHtml(BWC.normalizeAssetUrl(ev.image))}' alt='Event preview'>`:''}<input value='${escapeHtml(ev.title)}' data-i='${i}' data-k='title' placeholder='Event title'><input type='datetime-local' value='${escapeHtml(ev.datetime||'')}' data-i='${i}' data-k='datetime'><input value='${escapeHtml(ev.location)}' data-i='${i}' data-k='location' placeholder='Location'><textarea data-i='${i}' data-k='description' placeholder='Description'>${escapeHtml(ev.description)}</textarea><input value='${escapeHtml(ev.rsvpLink||'#')}' data-i='${i}' data-k='rsvpLink' placeholder='RSVP/action link'><input value='${escapeHtml(ev.image||'')}' data-i='${i}' data-k='image' placeholder='Image URL'><label class='buttonlike secondary'>Upload Event Image<input type='file' accept='image/*' data-upload='event' data-i='${i}' hidden></label><div class='record-actions'><button data-save-event='${i}'>Save Event</button><button class='secondary' data-duplicate-event='${i}'>Duplicate</button><button class='secondary' data-cancel-record>Cancel</button><button class='secondary danger' data-del='${i}'>Remove</button></div></article>`).join('')||'<p class="help">No events yet.</p>';
  box.querySelectorAll('[data-k]').forEach(el=>el.oninput=(e)=>{workingData.events[+e.target.dataset.i][e.target.dataset.k]=e.target.value;});
  markDirtyFromInputs(box);
  box.querySelectorAll('[data-save-event]').forEach(el=>el.onclick=async()=>{const event=workingData.events[+el.dataset.saveEvent]; await saveFromButton(el,'admin.event.saved',event?.title||event?.id||'event',drawEvents);});
  box.querySelectorAll('[data-duplicate-event]').forEach(el=>el.onclick=()=>{const event=clone(workingData.events[+el.dataset.duplicateEvent]); event.id=uid('evt'); event.title=`${event.title||'Event'} Copy`; workingData.events.unshift(event); drawEvents(); setCardStatus(box.querySelector('.admin-record-card'),'unsaved','Unsaved changes');});
  box.querySelectorAll('[data-cancel-record]').forEach(el=>el.onclick=()=>render());
  box.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{
    const event=workingData.events[+el.dataset.del];
    if(!event||!await confirmDanger('Delete event',`Delete "${event.title||'this event'}" from the resident portal events list?`,'Delete Event')) return;
    workingData.events.splice(+el.dataset.del,1);
    await saveAdminChange('admin.event.deleted',event.title||event.id,drawEvents);
  });
  box.querySelectorAll('[data-upload="event"]').forEach(el=>el.onchange=()=>handleFileToDataUrl(el,async(result,name)=>{const row=workingData.events[+el.dataset.i];row.image=result; if(!row.title) row.title=name; await saveAdminChange('admin.event.image.uploaded',row.title||name,drawEvents);}));
  document.getElementById('addEvent').onclick=()=>{const item=clone(blank.event);item.id=uid('evt');workingData.events.unshift(item);drawEvents(); setCardStatus(box.querySelector('.admin-record-card'),'unsaved','Unsaved changes');};
}

function drawProjects(){
  const box=document.getElementById('projectsEditor');
  box.innerHTML=workingData.projects.map((p,i)=>`<article class='admin-record-card'><div class='record-card-head'><strong>${escapeHtml(p.name||'New Project')}</strong><span class='status-pill'>${escapeHtml(p.status||'Planned')}</span>${adminStatus()}</div><input value='${escapeHtml(p.name)}' data-i='${i}' data-k='name' placeholder='Project name'><select data-i='${i}' data-k='status'><option ${p.status==='Planned'?'selected':''}>Planned</option><option ${p.status==='In Progress'?'selected':''}>In Progress</option><option ${p.status==='Completed'||p.status==='Complete'?'selected':''}>Completed</option><option ${p.status==='On Hold'?'selected':''}>On Hold</option></select><textarea data-i='${i}' data-k='description' placeholder='Project summary'>${escapeHtml(p.description)}</textarea><h4>Documents</h4><div class='project-doc-list'>${(p.documents||[]).map((d,di)=>`<div class='admin-edit-row'><input value='${escapeHtml(d.label||'')}' data-i='${i}' data-doc='${di}' data-k='label' placeholder='Document name'><input value='${escapeHtml(d.url||'')}' data-i='${i}' data-doc='${di}' data-k='url' placeholder='Document URL'><button class='secondary danger' data-dropdoc='${i}' data-doc='${di}'>Remove</button></div>`).join('')||'<p class="help">No project documents yet.</p>'}</div><div class='record-actions'><button data-save-project='${i}'>Save Project</button><button class='secondary' data-adddoc='${i}'>+ Add Document Link</button><label class='buttonlike secondary compact-upload'>Upload Document<input type='file' data-upload='doc' data-i='${i}' hidden></label><button class='secondary' data-cancel-record>Cancel</button><button class='secondary danger' data-delproj='${i}'>Remove Project</button></div></article>`).join('')||'<p class="help">No projects yet.</p>';
  box.querySelectorAll('[data-k]').forEach(el=>el.oninput=(e)=>{const {i,k,doc}=e.target.dataset; if(doc!==undefined){workingData.projects[+i].documents[+doc][k]=e.target.value;} else {workingData.projects[+i][k]=e.target.value;}});
  markDirtyFromInputs(box);

function drawForumModeration(){
  const box=document.getElementById('forumModeration');
  if(!box) return;
  const categories=workingData.portal.forumCategories||[];
  const threads=workingData.portal.forumThreads||[];
  const posts=workingData.portal.forumPosts||[];
  box.innerHTML=threads.length?threads.map(thread=>{
    const category=categories.find(c=>c.id===thread.categoryId);
    const threadPosts=posts.filter(post=>post.threadId===thread.id&&post.status!=='removed');
    return `<div class='item'><div class='request-admin-head'><strong>${escapeHtml(thread.title)}</strong><span>${escapeHtml(category?.name||'Forum')}</span><b>${thread.locked?'Locked':'Open'}</b></div><small>${threadPosts.length} posts - Started by ${escapeHtml(thread.authorName||'Resident')}</small><button class='secondary' data-lock-thread='${escapeHtml(thread.id)}'>${thread.locked?'Unlock Thread':'Lock Thread'}</button><button class='secondary danger' data-remove-thread='${escapeHtml(thread.id)}'>Remove Thread</button>${threadPosts.map(post=>`<div class='forum-post ${post.reported?'reported':''}'><strong>${escapeHtml(post.authorName||'Resident')}</strong>${post.reported?'<b>Reported</b>':''}<p>${escapeHtml(post.body||'')}</p><button class='secondary danger' data-remove-post='${escapeHtml(post.id)}'>Remove Post</button><button class='secondary' data-clear-report='${escapeHtml(post.id)}'>Clear Report</button></div>`).join('')}</div>`;
  }).join(''):'<p class="help">No forum threads yet.</p>';
  box.querySelectorAll('[data-lock-thread]').forEach(btn=>btn.onclick=async()=>{
    const thread=threads.find(item=>item.id===btn.dataset.lockThread);
    if(!thread) return;
    thread.locked=!thread.locked;
    await saveAdminChange('admin.forum.thread.lock',`${thread.title}: ${thread.locked?'locked':'unlocked'}`,drawForumModeration);
  });
  box.querySelectorAll('[data-remove-thread]').forEach(btn=>btn.onclick=async()=>{
    const thread=threads.find(item=>item.id===btn.dataset.removeThread);
    if(!thread||!await confirmDanger('Remove forum thread',`Remove "${thread.title}" and hide its posts?`,'Remove Thread')) return;
    thread.status='removed';
    posts.filter(post=>post.threadId===thread.id).forEach(post=>post.status='removed');
    await saveAdminChange('admin.forum.thread.removed',thread.title,drawForumModeration);
  });
  box.querySelectorAll('[data-remove-post]').forEach(btn=>btn.onclick=async()=>{
    const post=posts.find(item=>item.id===btn.dataset.removePost);
    if(!post||!await confirmDanger('Remove forum post','Remove this forum post from resident view?','Remove Post')) return;
    post.status='removed';
    post.reported=false;
    await saveAdminChange('admin.forum.post.removed',post.id,drawForumModeration);
  });
  box.querySelectorAll('[data-clear-report]').forEach(btn=>btn.onclick=async()=>{
    const post=posts.find(item=>item.id===btn.dataset.clearReport);
    if(!post) return;
    post.reported=false;
    await saveAdminChange('admin.forum.report.cleared',post.id,drawForumModeration);
  });
}

    const bulletin={id:uid('blt'),title,category:document.getElementById('bulletinCategory').value,body,authorId:adminActor,authorName:'HOA Board',status:'Published',startDate:document.getElementById('bulletinStartDate').value||new Date().toISOString().slice(0,10),expiresAt:document.getElementById('bulletinExpiresAt').value,attachmentName:'',attachmentUrl:BWC.sanitize(document.getElementById('bulletinAttachmentUrl').value,500),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    bulletins.unshift(bulletin);
    (workingData.portal.residents||[]).filter(r=>r.status==='active'&&r.email&&r.notificationPreferences?.bulletins!==false).forEach(r=>workingData.portal.notifications.unshift({id:uid('ntf'),type:'bulletin',residentId:r.id,email:r.email,subject:bulletin.title,message:'New bulletin board post queued for notification.',status:'queued',createdAt:new Date().toISOString()}));
    await saveAdminChange('admin.bulletin.published',title,drawBulletins);
  };
  box.querySelectorAll('[data-publish-bulletin]').forEach(btn=>btn.onclick=async()=>{const bulletin=bulletins.find(b=>b.id===btn.dataset.publishBulletin); if(!bulletin) return; bulletin.status='Published'; bulletin.updatedAt=new Date().toISOString(); await saveAdminChange('admin.bulletin.approved',bulletin.title,drawBulletins); drawDashboardCounts();});
  box.querySelectorAll('[data-reject-bulletin]').forEach(btn=>btn.onclick=async()=>{const bulletin=bulletins.find(b=>b.id===btn.dataset.rejectBulletin); if(!bulletin) return; bulletin.status='Rejected'; bulletin.updatedAt=new Date().toISOString(); await saveAdminChange('admin.bulletin.rejected',bulletin.title,drawBulletins); drawDashboardCounts();});
  box.querySelectorAll('[data-remove-bulletin]').forEach(btn=>btn.onclick=async()=>{const index=bulletins.findIndex(b=>b.id===btn.dataset.removeBulletin); const bulletin=bulletins[index]; if(index<0||!await confirmDanger('Remove bulletin',`Remove "${bulletin.title}"?`,'Remove Bulletin')) return; bulletins.splice(index,1); await saveAdminChange('admin.bulletin.removed',bulletin.title,drawBulletins); drawDashboardCounts();});
}

function drawResidentApprovals(){
  const box=document.getElementById('residentApprovals');
  BWC.normalizeResidents(workingData);
  const residents=workingData.portal.residents||[];
  const pending=residents.filter(r=>r.status==='pending');
  const active=residents.filter(r=>r.status==='active');
  const suspended=residents.filter(r=>r.status==='suspended');
  const contactsText=(r)=>BWC.normalizeHouseholdContacts(r).map(c=>[c.name,c.phone,c.email].filter(Boolean).join(' - ')).join('<br>')||'No household contacts listed';
  const rowCard=(r,actions='')=>`<div class='admin-record-card resident-admin-row' data-resident-row data-keywords='${escapeHtml(`${r.name||''} ${r.address||''} ${r.email||''} ${r.lot||''}`.toLowerCase())}'><div class='record-card-head'><strong>${escapeHtml(r.name)}</strong><span class='status-pill'>${escapeHtml(r.status||'pending')}</span></div><p>${escapeHtml(r.address||'No address')}</p><small>${escapeHtml(r.email)}${r.phone?` - ${escapeHtml(r.phone)}`:''}${r.lot?` - Lot ${escapeHtml(r.lot)}`:''}${r.parcel?` - Parcel ${escapeHtml(r.parcel)}`:''} - Directory: ${r.directoryOptIn?'Yes':'No'}</small><div class='household-contact-list'>${contactsText(r)}</div><div class='record-actions'>${actions}${r.role==='admin'?'':`<button data-remove-res='${escapeHtml(r.id)}' class='secondary danger'>Remove Resident</button>`}</div></div>`;
  box.innerHTML=`
    <div class='filter-pills'><button data-res-filter='all'>All</button><button data-res-filter='pending'>Pending Approval</button><button data-res-filter='active'>Approved</button><button data-res-filter='notlisted'>Not Listed in Directory</button><button data-res-filter='suspended'>Suspended</button></div>
    <h3>Pending Approval (${pending.length})</h3>
    ${pending.map(r=>rowCard(r,`<button data-approve-res='${escapeHtml(r.id)}'>Approve${r.directoryOptIn?' & Add to Directory':''}</button><button data-suspend-res='${escapeHtml(r.id)}' class='secondary danger'>Suspend</button>`)).join('')||'<p class="help">No pending resident approvals.</p>'}
    <h3>Master Directory Entries (${active.filter(r=>r.directoryOptIn).length})</h3>
    ${active.filter(r=>r.directoryOptIn).map(r=>rowCard(r,`<button data-optout-res='${escapeHtml(r.id)}' class='secondary'>Remove From Directory Only</button>`)).join('')||'<p class="help">No approved residents have opted into the directory yet.</p>'}
    <h3>Approved Non-Directory Residents (${active.filter(r=>!r.directoryOptIn).length})</h3>
    ${active.filter(r=>!r.directoryOptIn).map(r=>rowCard(r,`<button data-optin-res='${escapeHtml(r.id)}' class='secondary'>Add To Directory</button>`)).join('')||'<p class="help">None.</p>'}
    <h3>Suspended Residents (${suspended.length})</h3>
    ${suspended.map(r=>rowCard(r,`<button data-approve-res='${escapeHtml(r.id)}'>Reactivate</button>`)).join('')||'<p class="help">None.</p>'}`;
  const directoryBox=document.getElementById('directoryManagement');
  if(directoryBox) directoryBox.innerHTML=`<div class='admin-record-list'>${active.map(r=>rowCard(r,r.directoryOptIn?`<button data-optout-res='${escapeHtml(r.id)}' class='secondary'>Remove From Directory</button>`:`<button data-optin-res='${escapeHtml(r.id)}'>Add To Directory</button>`)).join('')||'<p class="help">No approved residents yet.</p>'}</div>`;
  const wireResidentButtons=(scope)=>{
    scope.querySelectorAll('[data-approve-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.approveRes); if(row){row.status='active'; await saveAdminChange('admin.approve',row.email); drawResidentApprovals(); drawDashboardCounts(); alert('Resident approved.');}});
    scope.querySelectorAll('[data-suspend-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.suspendRes); if(row){row.status='suspended'; await saveAdminChange('admin.suspend',row.email); drawResidentApprovals(); drawDashboardCounts(); alert('Resident suspended.');}});
    scope.querySelectorAll('[data-optout-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.optoutRes); if(row){row.directoryOptIn=false; await saveAdminChange('admin.directory.optout',row.email); drawResidentApprovals(); alert('Resident removed from directory but access remains active.');}});
    scope.querySelectorAll('[data-optin-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.optinRes); if(row){row.directoryOptIn=true; await saveAdminChange('admin.directory.optin',row.email); drawResidentApprovals(); alert('Resident added to directory.');}});
    scope.querySelectorAll('[data-remove-res]').forEach(btn=>btn.onclick=async()=>{
      const row=residents.find(r=>r.id===btn.dataset.removeRes);
      if(!row) return;
      if(!await confirmDanger('Remove resident',`Remove ${row.name || row.email} from resident access and the directory? This cannot be undone from this screen.`,'Remove Resident')) return;
      BWC.removeResidentFromData(workingData,row.id,'pin-admin');
      await BWC.saveData(workingData);
      drawResidentApprovals();
      drawDashboardCounts();
      alert('Resident removed.');
    });
  };
  wireResidentButtons(box);
  if(directoryBox) wireResidentButtons(directoryBox);
  const search=document.getElementById('residentSearch');
  if(search) search.oninput=()=>{const q=search.value.toLowerCase().trim(); box.querySelectorAll('[data-resident-row]').forEach(row=>row.style.display=!q||row.dataset.keywords.includes(q)?'block':'none');};
  box.querySelectorAll('[data-res-filter]').forEach(btn=>btn.onclick=()=>{const filter=btn.dataset.resFilter; box.querySelectorAll('[data-resident-row]').forEach(row=>{const text=row.textContent.toLowerCase(); row.style.display=filter==='all'||text.includes(filter)||filter==='notlisted'&&text.includes('directory: no')?'block':'none';});});
  return;
  box.querySelectorAll('[data-approve-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.approveRes); if(row){row.status='active'; await saveAdminChange('admin.approve',row.email); drawResidentApprovals(); drawDashboardCounts(); alert('Resident approved.');}});
  box.querySelectorAll('[data-suspend-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.suspendRes); if(row){row.status='suspended'; await saveAdminChange('admin.suspend',row.email); drawResidentApprovals(); drawDashboardCounts(); alert('Resident suspended.');}});
  box.querySelectorAll('[data-optout-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.optoutRes); if(row){row.directoryOptIn=false; await saveAdminChange('admin.directory.optout',row.email); drawResidentApprovals(); alert('Resident removed from directory but access remains active.');}});
  box.querySelectorAll('[data-optin-res]').forEach(btn=>btn.onclick=async()=>{const row=residents.find(r=>r.id===btn.dataset.optinRes); if(row){row.directoryOptIn=true; await saveAdminChange('admin.directory.optin',row.email); drawResidentApprovals(); alert('Resident added to directory.');}});
  box.querySelectorAll('[data-remove-res]').forEach(btn=>btn.onclick=async()=>{
    const row=residents.find(r=>r.id===btn.dataset.removeRes);
    if(!row) return;
    if(!await confirmDanger('Remove resident',`Remove ${row.name || row.email} from resident access and the directory? This cannot be undone from this screen.`,'Remove Resident')) return;
    BWC.removeResidentFromData(workingData,row.id,'pin-admin');
    await BWC.saveData(workingData);
    drawResidentApprovals();
    drawDashboardCounts();
    alert('Resident removed.');
  });
}

document.getElementById('login').onclick=async()=>{if(document.getElementById('pin').value!==BWC.defaultPin){setMessage('adminLoginMsg','Invalid PIN. Please try again.','error');return;}setMessage('adminLoginMsg','Opening admin dashboard...','success');auth.style.display='none';document.querySelector('.admin-login-wrap').style.display='none';dash.style.display='';render();};
BWC.wireSiteNav();
</script></body></html>
