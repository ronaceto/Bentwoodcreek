<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>About Us</title><link rel='stylesheet' href='/assets/hoa-style.css'></head><body><div class='container'><h1>About Bentwood Creek HOA</h1><div id='about'></div></div><script src='/assets/hoa-app.js'></script><script>(async()=>{const d=await BWC.getData();document.getElementById('about').innerHTML=`<section class='card'><h2>Board Roles</h2>${d.about.boardMembers.map(m=>`<p><strong>${m.role} — ${m.name}</strong><br>${m.description}</p>`).join('')}</section><section class='card'><h2>Committees</h2>${d.about.committees.map(c=>`<p><strong>${c.name}</strong><br>${c.description}</p>`).join('')}</section>`;})();</script></body></html>
