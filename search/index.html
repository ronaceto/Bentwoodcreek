</nav><div class='container'><h1>Search HOA Resources</h1><input id='q' placeholder='Search resources, events, or projects'><div id='results'></div></div><script src='/assets/hoa-app.js'></script><script>
BWC.wireSiteNav();

(async()=>{const d=await BWC.getData();const items=[...d.resources.map(r=>({type:'Resource',title:r.title,url:r.url,text:r.title})),...d.events.map(e=>({type:'Event',title:e.title,url:'/upcoming-events/',text:e.title+' '+e.description})),...d.projects.map(p=>({type:'Project',title:p.name,url:'/neighborhood-projects/',text:p.name+' '+p.description}))];const r=document.getElementById('results');function run(v=''){const q=v.toLowerCase();const m=items.filter(i=>i.text.toLowerCase().includes(q));r.innerHTML=m.map(i=>`<p class='card'><strong>${i.type}:</strong> <a href='${i.url}'>${i.title}</a></p>`).join('')||'<p>No matches found.</p>';}document.getElementById('q').addEventListener('input',e=>run(e.target.value));run();})();
</script></body></html>
