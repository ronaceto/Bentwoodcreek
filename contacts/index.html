<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Contact</title><link rel='stylesheet' href='/assets/hoa-style.css'></head><body><div class='container grid two'><section class='card'><h1>Contact the Board</h1><form id='contact'><input name='name' placeholder='Your name' required><input type='email' name='email' placeholder='Email' required><textarea name='message' placeholder='Message' required></textarea><button>Send</button></form></section><section class='card'><h2>Subscribe for alerts</h2><form id='sub'><input type='email' name='email' placeholder='Resident email' required><button>Subscribe</button></form><small>Stored for admin review.</small></section></div><script src='/assets/hoa-app.js'></script><script>
(async()=>{const d=await BWC.getData();document.getElementById('contact').onsubmit=(e)=>{e.preventDefault();const f=new FormData(e.target);d.contacts.push({name:f.get('name'),email:f.get('email'),message:f.get('message'),createdAt:new Date().toISOString()});BWC.saveData(d);alert('Thanks! Your message was submitted.');e.target.reset();};document.getElementById('sub').onsubmit=(e)=>{e.preventDefault();const f=new FormData(e.target);d.subscribers.push({email:f.get('email'),createdAt:new Date().toISOString()});BWC.saveData(d);alert('Subscribed.');e.target.reset();};})();
</script></body></html>
