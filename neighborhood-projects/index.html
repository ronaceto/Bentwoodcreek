<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Neighborhood Projects</title><link rel='stylesheet' href='/assets/hoa-style.css'></head><body><div class='container'><h1>Neighborhood Projects</h1><div id='projects'></div></div><script src='/assets/hoa-app.js'></script><script>
(async()=>{const d=await BWC.getData();const s={'Planned':1,'In Progress':2,'Complete':3};const list=[...d.projects].sort((a,b)=>(s[a.status]||9)-(s[b.status]||9));document.getElementById('projects').innerHTML=list.length?list.map(p=>`<section class='card'><h2>${p.name}</h2><p><strong>Status:</strong> ${p.status}</p><p>${p.description}</p><ul>${(p.documents||[]).map(doc=>`<li><a href='${doc.url}'>${doc.label}</a></li>`).join('')}</ul></section>`).join(''):"<p>No projects found.</p>";})();
</script></body></html>
