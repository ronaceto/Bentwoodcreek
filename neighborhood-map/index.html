<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Neighborhood Map</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'><link rel='stylesheet' href='/assets/hoa-style.css'></head><body><div class='container'><h1>Neighborhood Map</h1><div id='map' style='height:70vh' class='card'></div></div><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script src='/assets/hoa-app.js'></script><script>
(async()=>{const d=await BWC.getData();const first=d.mapLots[0]||{lat:35.922,lng:-78.74};const map=L.map('map').setView([first.lat,first.lng],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);d.mapLots.forEach(l=>L.marker([l.lat,l.lng]).addTo(map).bindTooltip(l.address));})();
</script></body></html>
