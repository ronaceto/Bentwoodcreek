<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neighborhood Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/assets/hoa-style.css?v=map-popout">
</head>
<body>
  <nav class="site-top" aria-label="Primary navigation">
  <div class="site-top-inner">
    <a class="site-home" href="/" aria-label="Home">&#8962;</a>
    <div class="site-menu">
      <a href="/about/">About Us</a>
      <div class="site-menu-links">
        <a href="/about/">Our Association</a>
        <a href="/welcome-to-the-neighborhood/">Welcome to the Neighborhood</a>
        <a href="/welcome-new-homeowners/">New Homeowners</a>
      </div>
    </div>
    <div class="site-menu">
      <a href="/quick-reference/">Resources</a>
      <div class="site-menu-links">
        <a href="/neighborhood-map/">Neighborhood Map</a>
        <a href="/quick-reference/">Quick Reference</a>
      </div>
    </div>
    <a href="/contact/">Contacts</a>
    <a class="resident-login-link" href="/resident-portal/">Resident Login</a>
    <div class="site-session"><span id="siteTopUser"></span><button id="siteTopLogout" type="button">Logout</button></div>
  </div>
</nav>
  <main class="container map-page">
    <header class="map-header">
      <div>
        <h1>Neighborhood Map</h1>
        <p class="help">Hover or tap a lot to view address, parcel details, and property links.</p>
      </div>
      <div class="map-header-actions">
        <a class="buttonlike secondary map-header-action" href="/neighborhood-map/popout/" target="_blank" rel="noopener noreferrer">Open Large Map</a>
        <a class="buttonlike map-header-action" href="/resident-portal/">Resident Login</a>
      </div>
    </header>

    <section class="map-workspace">
      <aside class="map-panel" aria-label="Lot lookup">
        <label for="lotSearch">Find a lot or address</label>
        <input id="lotSearch" type="search" placeholder="Lot, address, parcel">
        <div id="lotSummary" class="map-summary"></div>
        <div id="lotDetails" class="lot-details"></div>
        <div id="lotList" class="lot-list" aria-label="Neighborhood lots"></div>
      </aside>
      <div id="map" class="parcel-map" aria-label="Interactive neighborhood parcel map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/assets/hoa-app.js"></script>
  <script src="/assets/neighborhood-map.js"></script>
</body>
</html>
