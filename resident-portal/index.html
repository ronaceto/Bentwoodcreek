<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bentwood Creek Resident Portal MVP</title>
  <link rel="stylesheet" href="/assets/hoa-style.css" />
</head>
<body>
<main class="container">
  <section class="card"><h1>Resident Portal MVP (Rework)</h1><p class="help">Phase 1 rework: stronger validation, role gates, safer seed model, clearer admin workflows.</p></section>
  <section id="authCard" class="card"></section>
  <section id="portal" style="display:none"></section>
</main>
<script src="/assets/hoa-app.js"></script>
<script>
const $=id=>document.getElementById(id);
const card=(t,b)=>`<article class='card'><h2>${t}</h2>${b}</article>`;

function authView(){
  $('authCard').innerHTML=`<h2>Sign in</h2><input id='email' placeholder='Email'><input id='password' type='password' placeholder='Password'><button id='login'>Login</button>
  <h3>Request Resident Access</h3><input id='rname' placeholder='Full name'><input id='remail' placeholder='Email'><input id='raddress' placeholder='Property address'><input id='rpass' type='password' placeholder='Password (10+ chars)'><button id='register' class='secondary'>Submit for Approval</button>`;
  $('login').onclick=async()=>{ try{ await BWC.loginResident($('email').value,$('password').value); await render(); }catch(e){alert(e.message);} };
  $('register').onclick=async()=>{ try{ await BWC.registerResident({name:$('rname').value,email:$('remail').value,address:$('raddress').value,password:$('rpass').value}); alert('Submitted. An admin must approve your account.'); }catch(e){alert(e.message);} };
}

function renderPending(resident){
  $('portal').innerHTML=card('Account Pending Approval',`<p>Hello ${resident.name}. Your account is pending approval.</p><button id='logout' class='secondary'>Logout</button>`);
  $('logout').onclick=()=>{BWC.logout();location.reload();};
}

async function render(){
  const resident=await BWC.getSessionResident();
  if(!resident){ authView(); return; }
  $('authCard').style.display='none'; $('portal').style.display='block';
  if(resident.status!=='active') return renderPending(resident);

  const data=await BWC.getData(); BWC.ensurePortal(data);
  const announcements=data.portal.announcements.map(a=>`<li><strong>${a.title}</strong> <small>${a.date}</small></li>`).join('')||'<li>None</li>';
  const events=data.events.map(e=>`<li><strong>${e.title}</strong> ${e.datetime}<br><button data-rsvp='${e.id}'>RSVP Yes</button></li>`).join('')||'<li>None</li>';
  const docs=data.portal.documents.map(d=>`<li>${d.name} (${d.category}) ${d.driveFileId?`<small>Drive ID: ${d.driveFileId}</small>`:''}</li>`).join('')||'<li>None</li>';
  const myReq=(data.portal.requests||[]).filter(r=>r.residentId===resident.id).map(r=>`<li>#${r.caseNumber} ${r.type} — ${r.status}</li>`).join('')||'<li>No requests</li>';
  const dir=(data.portal.residents||[]).filter(r=>r.status==='active'&&r.directoryOptIn).map(r=>`${r.name} (${r.address||'Address hidden'})`).join('<br>')||'No directory entries';
  const logs=(data.portal.auditLogs||[]).slice(0,12).map(l=>`<li>${l.timestamp}: ${l.action} (${l.details||''})</li>`).join('')||'<li>No logs</li>';

  $('portal').innerHTML=
    card('Welcome',`<p><strong>${resident.name}</strong> (${resident.role})</p><button id='logout' class='secondary'>Logout</button>`)+
    `<div class='grid two'>${card('Announcements',`<ul>${announcements}</ul>`)}${card('Events & RSVPs',`<ul>${events}</ul>`)}</div>`+
    `<div class='grid two'>${card('Document Library',`<ul>${docs}</ul>`)}${card('Requests',`<ul>${myReq}</ul><textarea id='reqText' placeholder='Request details'></textarea><select id='reqType'><option>Maintenance</option><option>Architectural Change</option></select><button id='submitReq'>Submit Request</button>`)}</div>`+
    `<div class='grid two'>${card('Resident Directory',`<label><input id='optin' type='checkbox' ${resident.directoryOptIn?'checked':''}> Opt in to directory</label><div id='dir'>${dir}</div>`)}${card('Map + Payments Planning',`<p>Map foundation uses lot markers from managed map lots. Payment integration evaluation target: Stripe vs PayPal/Braintree for cards, ACH, Apple Pay, Venmo.</p>`)}</div>`+
    (resident.role==='admin'?card('Admin Workflow',`<p>Pending approvals: ${(data.portal.residents||[]).filter(r=>r.status==='pending').length}</p><div id='pending'></div><h3>Create announcement</h3><input id='annTitle' placeholder='Title'><button id='addAnn'>Post</button>`):'')+
    card('Audit Logs',`<ul>${logs}</ul>`);

  $('logout').onclick=()=>{BWC.logout();location.reload();};
  document.querySelectorAll('[data-rsvp]').forEach(b=>b.onclick=()=>{data.portal.rsvps.push({id:BWC.uid('rsvp'),eventId:b.dataset.rsvp,residentId:resident.id,response:'yes',createdAt:new Date().toISOString()}); BWC.logAction(data,resident.id,'event.rsvp',b.dataset.rsvp); BWC.saveData(data); render();});
  $('submitReq').onclick=()=>{const description=BWC.sanitize($('reqText').value,300); if(!description) return alert('Enter request details.'); const type=$('reqType').value; data.portal.requests.push({id:BWC.uid('req'),caseNumber:`REQ-${Date.now()}`,residentId:resident.id,type,status:'Submitted',description,createdAt:new Date().toISOString()}); BWC.logAction(data,resident.id,'request.submitted',type); BWC.saveData(data); render();};
  $('optin').onchange=()=>{resident.directoryOptIn=$('optin').checked; BWC.logAction(data,resident.id,'directory.optin',resident.directoryOptIn?'enabled':'disabled'); BWC.saveData(data); render();};

  if(resident.role==='admin'){
    const pending=(data.portal.residents||[]).filter(r=>r.status==='pending').map(r=>`<div class='item'>${r.name} (${r.email}) <button data-approve='${r.id}'>Approve</button> <button data-deny='${r.id}' class='secondary danger'>Suspend</button></div>`).join('')||'No pending approvals';
    $('pending').innerHTML=pending;
    document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{const row=data.portal.residents.find(x=>x.id===b.dataset.approve); if(row){row.status='active'; BWC.logAction(data,resident.id,'admin.approve',row.email); BWC.saveData(data); render();}});
    document.querySelectorAll('[data-deny]').forEach(b=>b.onclick=()=>{const row=data.portal.residents.find(x=>x.id===b.dataset.deny); if(row){row.status='suspended'; BWC.logAction(data,resident.id,'admin.suspend',row.email); BWC.saveData(data); render();}});
    $('addAnn').onclick=()=>{const title=BWC.sanitize($('annTitle').value,120); if(!title) return alert('Add a title.'); data.portal.announcements.unshift({id:BWC.uid('ann'),title,date:new Date().toISOString().slice(0,10)}); BWC.logAction(data,resident.id,'announcement.created',title); BWC.saveData(data); render();};
  }
}
render();
</script>
</body>
</html>
