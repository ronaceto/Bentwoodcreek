<script>
const $=id=>document.getElementById(id);
const card=(t,b)=>`<article class='card'><h2>${t}</h2>${b}</article>`;
const escapeHtml=(value)=>String(value||'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const setMessage=(id,text,type='error')=>{const el=$(id); if(!el) return; el.textContent=text||''; el.className=`form-message ${type} ${text?'show':''}`;};
const linkifyText=(value)=>escapeHtml(value).replace(/\n/g,'<br>').replace(/(https?:\/\/[^\s<]+)/g,"<a href='$1' target='_blank' rel='noopener noreferrer'>$1</a>");
const todayIso=()=>new Date().toISOString().slice(0,10);
const isActiveWindow=(item)=>String(item.status||'Published')!=='Expired'&&(!item.startDate||item.startDate<=todayIso())&&(!item.expiresAt||item.expiresAt>=todayIso())&&(!item.endDate||item.endDate>=todayIso());
let requestAttachment=null;
const params=new URLSearchParams(location.search);
const selectedLot=params.get('lot');
const authMode=String(params.get('mode')||location.hash.replace('#','')||(selectedLot?'register':'signin')).toLowerCase();
async function fileToAttachment(input){
  const file=input?.files&&input.files[0];
  if(!file) return {name:'',url:''};
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name,url:reader.result});
    reader.readAsDataURL(file);
  });
}

function residentDisplayName(resident){return resident?.name||resident?.email||'Resident';}
function mentionsFrom(text){
  const matches=String(text||'').match(/@[\w.-]+/g)||[];
  return [...new Set(matches.map(match=>match.slice(1).toLowerCase()))];
}
function queueMentionNotifications(data,actor,body,context){
  const mentions=mentionsFrom(body);
  if(!mentions.length) return;
  const residents=data.portal.residents||[];
  mentions.forEach(handle=>{
    const target=residents.find(r=>String(r.email||'').toLowerCase().startsWith(handle)||String(r.name||'').toLowerCase().replace(/\s+/g,'.')===handle);
    if(target&&target.notificationPreferences?.mentions!==false){
      data.portal.notifications.unshift({id:BWC.uid('ntf'),type:'mention',residentId:target.id,email:target.email,subject:'You were mentioned in the Resident Portal',message:`${residentDisplayName(actor)} mentioned you in ${context}.`,status:'queued',createdAt:new Date().toISOString()});
    }
  });
}
function renderPortalNav(){
  const items=[
    ['announcements','Announcements','Announcements'],
    ['events','Events & RSVPs','Events & RSVPs'],
    ['documents','Documents','Documents'],
    ['requests','Requests','Requests'],
    ['forums','Forums','Forums'],
    ['newsletters','Newsletters','Newsletters'],
    ['polls','Polls','Polls'],
    ['bulletins','Bulletin<br>Board','Bulletin Board'],
    ['portal-map','Map','Map'],
    ['directory','Directory','Directory']
  ];
  return `<nav class='portal-nav portal-side-nav' aria-label='Resident portal sections'><div class='portal-section-switcher'><label for='portalSectionSelect'>Portal section</label><select id='portalSectionSelect' aria-label='Choose portal section'>${items.map(([id,,text])=>`<option value='${id}'>${text}</option>`).join('')}</select></div><div class='portal-tab-row'>${items.map(([id,label],index)=>`<button type='button' class='portal-tab ${index===0?'active':''}' data-tab-target='${id}' aria-controls='${id}' aria-selected='${index===0?'true':'false'}'><span>${label}</span></button>`).join('')}</div></nav>`;
}
function renderForums(data,resident){
  const categories=data.portal.forumCategories||[];
  const threads=data.portal.forumThreads||[];
  const posts=data.portal.forumPosts||[];
  const activeThreads=threads.filter(thread=>thread.status!=='removed');
  const latestPost=(thread)=>posts.filter(post=>post.threadId===thread.id&&post.status!=='removed').sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];
  const threadList=activeThreads.map(thread=>{
    const category=categories.find(c=>c.id===thread.categoryId);
    const threadPosts=posts.filter(post=>post.threadId===thread.id&&post.status!=='removed');
    const latest=latestPost(thread);
    return `<article class='comm-item' data-forum-thread-row data-category='${escapeHtml(thread.categoryId)}' data-keywords='${escapeHtml(`${thread.title} ${thread.authorName} ${category?.name||''} ${threadPosts.map(p=>p.body).join(' ')}`.toLowerCase())}'>
      <div class='comm-item-head'><strong>${escapeHtml(thread.title)}</strong><span>${escapeHtml(category?.name||'Forum')}</span><small>${escapeHtml(thread.locked?'Locked':'Open')} - ${escapeHtml(thread.createdAt?.slice(0,10)||'')}</small></div>
      <p class='help'>${threadPosts.length} posts${latest?` - Latest by ${escapeHtml(latest.authorName||'Resident')}`:''}</p>
      <div class='thread-posts'>${threadPosts.slice(0,6).map(post=>`<div class='forum-post ${post.parentId?'nested':''}'><strong>${escapeHtml(post.authorName||'Resident')}</strong><small>${escapeHtml(post.createdAt?.slice(0,16).replace('T',' ')||'')}</small><p>${linkifyText(post.body)}</p>${post.attachmentUrl?`<a href='${escapeHtml(post.attachmentUrl)}' target='_blank' rel='noopener noreferrer'>${escapeHtml(post.attachmentName||'Attachment')}</a>`:''}<button class='secondary' data-quote-post='${escapeHtml(post.id)}'>Quote / Reply</button><button class='secondary' data-report-post='${escapeHtml(post.id)}'>Report Post</button></div>`).join('')}</div>
      ${thread.locked?'<p class="help">This thread is locked by an admin.</p>':`<div class='forum-reply-box'><textarea data-forum-reply='${escapeHtml(thread.id)}' placeholder='Reply to this thread. Use @name or @email to mention a neighbor.'></textarea><input data-forum-file='${escapeHtml(thread.id)}' type='file'><button data-submit-reply='${escapeHtml(thread.id)}'>Post Reply</button></div>`}
    </article>`;
  }).join('')||'<p class="help">No forum threads yet. Start the first conversation.</p>';
  const categoryOptions=categories.map(category=>`<option value='${escapeHtml(category.id)}'>${escapeHtml(category.name)}</option>`).join('');
  const categoryFilterOptions=`<option value='all'>All Categories</option>${categoryOptions}`;
  const prefs=resident.forumCategorySubscriptions||{};
  const subscriptionControls=categories.map(category=>`<label class='inline-check'><input type='checkbox' data-forum-category-sub='${escapeHtml(category.id)}' ${prefs[category.id]!==false?'checked':''}> Notify me about ${escapeHtml(category.name)}</label>`).join('');
  return `<section id='forums' class='portal-tab-panel portal-section' style='display:none'>${card('Discussion Forums',`
      <div class='communication-toolbar'><input id='forumSearch' type='search' placeholder='Search forums by keyword, author, category, or date'><select id='forumFilter'>${categoryFilterOptions}</select></div>
      <details><summary>Forum notification preferences</summary>${subscriptionControls}</details>
      <div id='forumMsg' class='form-message' role='status'></div>
      <details class='compose-panel'><summary>+ New Discussion</summary><div class='comm-form'><h3>Create Thread</h3><input id='forumTitle' placeholder='Thread title'><textarea id='forumBody' placeholder='Start a discussion. Basic links, line breaks, quoting, and @mentions are supported.'></textarea><input id='forumAttachment' type='file'><div class='record-actions'><button id='createThread'>Create Thread</button><button type='button' class='secondary' onclick='this.closest("details").open=false'>Cancel</button></div></div></details>
      <div class='comm-list'>${threadList}</div>
    `)}</section>`;
}
function renderNewsletters(data,currentResident){
  const newsletters=(data.portal.newsletters||[]).filter(n=>String(n.status||'Published')!=='Draft').sort((a,b)=>String(b.sentAt||b.createdAt||'').localeCompare(String(a.sentAt||a.createdAt||'')));
  const prefs=currentResident.notificationPreferences||{};
  return `<section id='newsletters' class='portal-tab-panel portal-section' style='display:none'>${card('Newsletters Archive',`
      <div id='prefMsg' class='form-message' role='status'></div>
      <label class='inline-check'><input id='newsletterOptIn' type='checkbox' ${prefs.newsletters!==false?'checked':''}> Email me newsletters and community updates</label>
      <label class='inline-check'><input id='bulletinOptIn' type='checkbox' ${prefs.bulletins!==false?'checked':''}> Notify me about bulletin board posts</label>
      <div class='comm-list'>${newsletters.map(n=>`<article class='comm-item'><div class='comm-item-head'><strong>${escapeHtml(n.subject||'Newsletter')}</strong><small>${escapeHtml((n.sentAt||n.createdAt||'').slice(0,10))}</small></div><p>${linkifyText(n.body||'')}</p>${n.attachmentUrl?`<a href='${escapeHtml(n.attachmentUrl)}' target='_blank' rel='noopener noreferrer'>${escapeHtml(n.attachmentName||'Attachment')}</a>`:''}</article>`).join('')||'<p class="help">No newsletters have been published yet.</p>'}</div>
    `)}</section>`;
}
function renderPolls(data,resident){
  const polls=(data.portal.polls||[]).filter(p=>String(p.status||'Open')!=='Archived').sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  const responses=data.portal.pollResponses||[];
  return `<section id='polls' class='portal-tab-panel portal-section' style='display:none'>${card('Polls & Surveys',`
      <div id='pollMsg' class='form-message' role='status'></div>
      <div class='comm-list'>${polls.map(poll=>{
        const myResponse=responses.find(r=>r.pollId===poll.id&&r.residentId===resident.id);
        const pollResponses=responses.filter(r=>r.pollId===poll.id);
        const options=Array.isArray(poll.options)?poll.options:String(poll.options||'').split('|').filter(Boolean);
        const closed=String(poll.status||'Open')==='Closed'||!isActiveWindow(poll);
        const results=options.map(option=>{
          const count=pollResponses.filter(r=>(Array.isArray(r.answers)?r.answers:[r.answers]).includes(option)).length;
          const pct=pollResponses.length?Math.round(count/pollResponses.length*100):0;
          return `<div class='poll-bar'><span>${escapeHtml(option)}</span><b style='width:${pct}%'></b><small>${count}</small></div>`;
        }).join('');
        const input=poll.answerType==='free-text'
          ? `<textarea data-poll-free='${escapeHtml(poll.id)}' placeholder='Share your response'></textarea>`
          : options.map(option=>`<label class='inline-check'><input name='poll-${escapeHtml(poll.id)}' value='${escapeHtml(option)}' type='${poll.answerType==='multiple'?'checkbox':'radio'}'> ${escapeHtml(option)}</label>`).join('');
        return `<article class='comm-item'><div class='comm-item-head'><strong>${escapeHtml(poll.question)}</strong><span>${escapeHtml(poll.answerType||'single')}</span><small>${escapeHtml(poll.startDate||'')} to ${escapeHtml(poll.endDate||'')}</small></div>${myResponse?'<p class="help">Your response has been recorded.</p>':closed?'<p class="help">This poll is closed.</p>':`${input}<button data-submit-poll='${escapeHtml(poll.id)}'>Submit Response</button>`}${poll.showResults||closed?`<div class='poll-results'>${results||'<p class="help">No responses yet.</p>'}</div>`:''}</article>`;
      }).join('')||'<p class="help">No polls or surveys are open right now.</p>'}</div>
    `)}</section>`;
}
function renderBulletins(data,resident){
  const bulletins=(data.portal.bulletins||[]).filter(b=>String(b.status||'Published')==='Published'&&isActiveWindow(b)).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  const categories=[...new Set(['All','Announcements','Reminders','Lost & Found','For Sale','Social',...bulletins.map(b=>b.category||'Announcements')])];
  return `<section id='bulletins' class='portal-tab-panel portal-section' style='display:none'>${card('Digital Bulletin Board',`
      <div class='communication-toolbar'><input id='bulletinSearch' type='search' placeholder='Search bulletin board'><select id='bulletinFilter'>${categories.map(c=>`<option>${escapeHtml(c)}</option>`).join('')}</select></div>
      <div id='bulletinMsg' class='form-message' role='status'></div>
      <details><summary>Submit a community bulletin for review</summary><div class='comm-form'><input id='residentBulletinTitle' placeholder='Title'><select id='residentBulletinCategory'><option>Lost & Found</option><option>For Sale</option><option>Social</option><option>Reminders</option></select><textarea id='residentBulletinBody' placeholder='Post details'></textarea><button id='submitResidentBulletin'>Submit for Moderation</button></div></details>
      <div class='comm-list'>${bulletins.map(b=>`<article class='comm-item' data-bulletin-row data-category='${escapeHtml(b.category||'Announcements')}' data-keywords='${escapeHtml(`${b.title} ${b.body} ${b.category} ${b.authorName}`.toLowerCase())}'><div class='comm-item-head'><strong>${escapeHtml(b.title)}</strong><span>${escapeHtml(b.category||'Announcements')}</span><small>${escapeHtml((b.startDate||b.createdAt||'').slice(0,10))}</small></div><p>${linkifyText(b.body||'')}</p>${b.attachmentUrl?`<a href='${escapeHtml(b.attachmentUrl)}' target='_blank' rel='noopener noreferrer'>${escapeHtml(b.attachmentName||'Attachment')}</a>`:''}</article>`).join('')||'<p class="help">No bulletin board posts are active right now.</p>'}</div>
    `)}</section>`;
}
function wirePortalTabs(defaultTab='announcements'){
  const tabs=[...document.querySelectorAll('[data-tab-target]')];
  const panels=[...document.querySelectorAll('.portal-tab-panel')];
  const available=new Set(panels.map(panel=>panel.id));
  const hashTarget=location.hash.replace('#','');
  let active=available.has(hashTarget)?hashTarget:defaultTab;
  if(!available.has(active)&&panels[0]) active=panels[0].id;
  const show=(id,updateHash=true)=>{
    panels.forEach(panel=>{panel.style.display=panel.id===id?'block':'none';});
    tabs.forEach(tab=>{
      const selected=tab.dataset.tabTarget===id;
      tab.classList.toggle('active',selected);
      tab.setAttribute('aria-selected',selected?'true':'false');
    });
    const select=document.getElementById('portalSectionSelect');
    if(select&&select.value!==id) select.value=id;
    if(updateHash&&location.hash!==`#${id}`) history.replaceState(null,'',`#${id}`);
  };
  tabs.forEach(tab=>tab.onclick=()=>show(tab.dataset.tabTarget));
  const select=document.getElementById('portalSectionSelect');
  if(select) select.onchange=()=>show(select.value);
  show(active,false);
}

async function authView(){
  const data=await BWC.getData();
  const lot=(data.mapLots||[]).find(l=>String(l.lot)===String(selectedLot));
  const address=lot?`${lot.address}, ${lot.city||'Collierville'}, ${lot.state||'TN'} ${lot.zip||'38017'}`:'';
  const lotIntro=lot?`<div class='item'><strong>Registering for Lot ${lot.lot}</strong><br>${address}<br><small>Parcel ${lot.parcel}</small></div>`:'';
  const registerHref=`/resident-portal/?mode=register${lot?`&lot=${encodeURIComponent(lot.lot)}`:''}`;
  if(authMode==='register'){
    $('authCard').innerHTML=`<h2>Request Resident Access</h2><p class='help'>Submit your household information for HOA approval. After approval, you can sign in with your email and password.</p>${lotIntro}<div id='registerMsg' class='form-message' role='status'></div><input id='rname' placeholder='Primary resident name' autocomplete='name'><input id='rphone' placeholder='Primary phone number' autocomplete='tel'><input id='remail' placeholder='Primary email' autocomplete='email'><div class='grid two'><input id='rname2' placeholder='Additional household name'><input id='rphone2' placeholder='Additional phone number'></div><input id='remail2' placeholder='Additional email'><input id='raddress' placeholder='Property address' value='${escapeHtml(address)}'><label class='inline-check'><input id='rdir' type='checkbox' checked> Add my household to the resident directory after approval</label><input id='rpass' type='password' placeholder='Password (10+ chars)' autocomplete='new-password'><button id='register'>Submit for Approval</button><a class='buttonlike secondary' href='/resident-portal/'>Already registered? Sign in</a>`;
    $('register').onclick=async()=>{ try{ setMessage('registerMsg','Submitting your registration...','info'); const rec=await BWC.registerResident({name:$('rname').value,phone:$('rphone').value,email:$('remail').value,address:$('raddress').value,lot:lot?.lot||'',parcel:lot?.parcel||'',directoryOptIn:$('rdir').checked,password:$('rpass').value,householdContacts:[{name:$('rname').value,phone:$('rphone').value,email:$('remail').value},{name:$('rname2').value,phone:$('rphone2').value,email:$('remail2').value}]}); $('authCard').innerHTML=`<h2>Submitted for Approval</h2><p><strong>${escapeHtml(rec.name)}</strong> is pending admin approval for ${escapeHtml(rec.address)}.</p><p class='help'>${rec.directoryOptIn?'After admin approval, this household will be added to the resident directory.':'This household will not appear in the directory unless directory opt-in is enabled later.'}</p><a class='buttonlike' href='/resident-portal/'>Back to Sign In</a><a class='buttonlike secondary' href='/neighborhood-map/'>Back to Parcel Map</a>`; }catch(e){setMessage('registerMsg',e.message||'Unable to submit registration.','error');} };
    return;
  }
  $('authCard').innerHTML=`<h2>Sign In</h2><p class='help'>Enter the email and password for your approved resident account.</p><div id='loginMsg' class='form-message' role='status'></div><input id='email' placeholder='Email' autocomplete='email'><input id='password' type='password' placeholder='Password' autocomplete='current-password'><button id='login'>Sign In</button><p class='help'>Not registered yet?</p><a class='buttonlike secondary' href='${registerHref}'>Register for Resident Access</a>`;
  $('login').onclick=async()=>{ try{ setMessage('loginMsg','Signing in...','info'); await BWC.loginResident($('email').value,$('password').value); setMessage('loginMsg','Login successful. Opening the portal...','success'); await render(); }catch(e){setMessage('loginMsg',e.message||'Unable to sign in.','error');} };
}

function renderPending(resident){
  $('portal').innerHTML=card('Account Pending Approval',`<p>Hello ${resident.name}. Your account is pending approval.</p><button id='logout' class='secondary'>Logout</button>`);
  $('logout').onclick=()=>{BWC.logout();location.reload();};
}

async function render(){
  const resident=await BWC.getSessionResident();
  await BWC.wireSiteNav();
  if(!resident){ await authView(); return; }
  $('authCard').style.display='none'; $('portal').style.display='block';
  if(resident.status!=='active') return renderPending(resident);

  const data=await BWC.getData(); BWC.ensurePortal(data); BWC.normalizeResidents(data);
  const currentResident=data.portal.residents.find(r=>r.id===resident.id)||resident;
  const announcements=data.portal.announcements.map(a=>`<li><strong>${a.title}</strong> <small>${a.date}</small></li>`).join('')||'<li>None</li>';
  const events=data.events.map(e=>`<li><strong>${e.title}</strong> ${e.datetime}<br><button data-rsvp='${e.id}'>RSVP Yes</button></li>`).join('')||'<li>None</li>';
  const projectOrder={'In Progress':1,'Planned':2,'Complete':3};
  const projects=[...(data.projects||[])].sort((a,b)=>(projectOrder[a.status]||9)-(projectOrder[b.status]||9)).map(p=>`
    <article class='request-card'>
      <strong>${escapeHtml(p.name||'Neighborhood Project')}</strong>
      <b>${escapeHtml(p.status||'Planned')}</b>
      <p>${escapeHtml(p.description||'No project details posted yet.')}</p>
      ${(p.documents||[]).length?`<div class='request-links'>${p.documents.map(doc=>`<a href='${escapeHtml(doc.url||'#')}' target='_blank' rel='noopener noreferrer'>${escapeHtml(doc.label||'Project document')}</a>`).join('')}</div>`:''}
    </article>`).join('')||'<p class="help">No neighborhood projects have been posted yet.</p>';
  const docCategories=['Governing Documents','Architectural Review','Financial / Assessments','Meeting Minutes','Projects','Forms'];
  const docs=docCategories.map(category=>{
    const items=(data.portal.documents||[]).filter(d=>(d.category||'Forms')===category);
    const body=items.length?items.map(d=>`
      <article class='doc-item'>
        <strong>${d.url?`<a href='${escapeHtml(d.url)}' target='_blank' rel='noopener noreferrer'>${escapeHtml(d.name)}</a>`:escapeHtml(d.name)}</strong>
        ${d.description?`<p>${escapeHtml(d.description)}</p>`:''}
        ${d.driveFileId?`<small>Drive ID: ${escapeHtml(d.driveFileId)}</small>`:''}
      </article>`).join(''):`<p class='help'>No ${escapeHtml(category.toLowerCase())} documents yet.</p>`;
    return `<section class='doc-category'><h3>${escapeHtml(category)}</h3>${body}</section>`;
  }).join('');
  const myReq=(data.portal.requests||[]).filter(r=>r.residentId===resident.id).map(r=>`
    <article class='request-card request-${escapeHtml(String(r.status||'submitted').toLowerCase())}'>
      <strong>#${escapeHtml(r.caseNumber||'Pending')}</strong>
      <span>${escapeHtml(r.type||'Request')}</span>
      <b>${escapeHtml(r.status||'Submitted')}</b>
      <p>${escapeHtml(r.description||'No description provided.')}</p>
      ${r.attachmentName?`<small>Attachment: ${r.attachmentUrl?`<a href='${escapeHtml(r.attachmentUrl)}' target='_blank' rel='noopener noreferrer'>${escapeHtml(r.attachmentName)}</a>`:escapeHtml(r.attachmentName)}</small>`:''}
      ${r.fileLink?`<small>Linked file: <a href='${escapeHtml(r.fileLink)}' target='_blank' rel='noopener noreferrer'>${escapeHtml(r.fileLink)}</a></small>`:''}
      ${r.adminNote?`<small>Admin note: ${escapeHtml(r.adminNote)}</small>`:''}
    </article>`).join('')||'<p class="help">No requests yet.</p>';
  const dir=(data.portal.residents||[]).filter(r=>r.status==='active'&&r.directoryOptIn).map(r=>{
    const contacts=BWC.normalizeHouseholdContacts(r).map(c=>[c.name,c.phone,c.email].filter(Boolean).join(' - ')).join('<br>');
    return `<strong>${escapeHtml(r.name)}</strong> (${escapeHtml(r.address||'Address hidden')})<br>${escapeHtml(contacts).replaceAll('&lt;br&gt;','<br>')}`;
  }).join('<hr>')||'No directory entries';
  const logs=(data.portal.auditLogs||[]).slice(0,12).map(l=>`<li>${l.timestamp}: ${l.action} (${l.details||''})</li>`).join('')||'<li>No logs</li>';

  $('portal').innerHTML=
    card('Welcome',`<p><strong>${resident.name}</strong> (${resident.role})</p><button id='logout' class='secondary'>Logout</button>`)+
    renderPortalNav()+
    `<section id='announcements' class='portal-tab-panel portal-section'>${card('Announcements',`<ul>${announcements}</ul><p><button type='button' class='buttonlike secondary inline-tab-link' data-tab-link='newsletters'>Open newsletter archive</button></p>`)}</section>`+
    `<section id='events' class='portal-tab-panel portal-section' style='display:none'>${card('Events & RSVPs',`<ul>${events}</ul>`)}${card('Neighborhood Projects',`<div class='request-list'>${projects}</div>`)}</section>`+
    `<section id='documents' class='portal-tab-panel portal-section' style='display:none'>${card('Documents',`<div class='doc-library'>${docs}</div>`)}</section>`
    +`<section id='requests' class='portal-tab-panel portal-section' style='display:none'>${card('Requests',`<div class='request-list'>${myReq}</div><details class='compose-panel'><summary>+ New Request</summary><h3>Submit Request</h3><div id='requestMsg' class='form-message' role='status'></div><select id='reqType'><option>Architectural Change</option><option>Maintenance</option><option>General Question</option></select><textarea id='reqText' placeholder='Describe the request, project scope, materials, colors, timing, or issue.'></textarea><input id='reqFileLink' placeholder='Optional link to plans, photos, or documents'><label class='buttonlike secondary'>Upload File<input id='reqUpload' type='file' hidden></label><div id='reqAttachmentName' class='map-summary'></div><div class='record-actions'><button id='submitReq'>Submit Request</button><button type='button' class='secondary' onclick='this.closest("details").open=false'>Cancel</button></div></details>`)}</section>`+
    `<section id='directory' class='portal-tab-panel portal-section' style='display:none'>${card('My Directory Listing',`<details class='compose-panel'><summary>Edit Listing</summary><label class='inline-check'><input id='optin' type='checkbox' ${currentResident.directoryOptIn?'checked':''}> List my household in the directory</label><input id='dirName' value='${escapeHtml(currentResident.name||'')}' placeholder='Primary resident name'><input id='dirPhone' value='${escapeHtml(currentResident.phone||'')}' placeholder='Directory phone number'><input id='dirEmail' value='${escapeHtml(currentResident.email||'')}' placeholder='Primary email'><div class='record-actions'><button id='saveDirectoryListing'>Save Listing</button><button type='button' class='secondary' onclick='this.closest("details").open=false'>Cancel</button></div></details><h3>Resident Directory</h3><div id='dir'>${dir}</div><a class='buttonlike secondary' href='/directory/'>Open Full Directory Page</a><button id='removeMyPortalAccount' class='secondary danger' type='button'>Remove My Resident Account</button>`)}</section>`+
    renderForums(data,currentResident)+
    renderNewsletters(data,currentResident)+
    renderPolls(data,currentResident)+
    renderBulletins(data,currentResident)+
    `<section id='portal-map' class='portal-tab-panel portal-section' style='display:none'>${card('Resident Map & Directory Lookup',`<p class='help'>Hover over a home to view parcel details and opted-in resident directory information.</p><section class='map-workspace portal-map-workspace'><aside class='map-panel' aria-label='Lot lookup'><label for='lotSearch'>Find a lot or address</label><input id='lotSearch' type='search' placeholder='Lot, address, parcel'><div id='lotSummary' class='map-summary'></div><div id='lotDetails' class='lot-details'></div><div id='lotList' class='lot-list' aria-label='Neighborhood lots'></div></aside><div id='map' class='parcel-map portal-parcel-map' data-directory='true' aria-label='Resident directory parcel map'></div></section>`)}</section>`+
    (resident.role==='admin'?card('Admin Workflow',`<h3>Resident Approvals</h3><p>Pending approvals: ${(data.portal.residents||[]).filter(r=>r.status==='pending').length}</p><div id='pending'></div><h3>Create announcement</h3><input id='annTitle' placeholder='Title'><button id='addAnn'>Post</button>`):'');

  wirePortalTabs();
  let portalMapRendered=false;
  const renderPortalMapOnce=async()=>{
    if(portalMapRendered||!BWC.renderNeighborhoodMap) return;
    portalMapRendered=true;
    await BWC.renderNeighborhoodMap();
  };
  document.querySelector('[data-tab-target="portal-map"]')?.addEventListener('click',()=>setTimeout(renderPortalMapOnce,0));
  if(document.getElementById('portal-map')?.style.display==='block') await renderPortalMapOnce();
  document.querySelectorAll('[data-tab-link]').forEach(btn=>btn.onclick=()=>{
    const target=document.querySelector(`[data-tab-target="${btn.dataset.tabLink}"]`);
    if(target){target.click(); document.querySelector('.portal-side-nav')?.scrollIntoView({block:'start'});}
  });
  $('logout').onclick=()=>{BWC.logout();location.reload();};
  $('removeMyPortalAccount').onclick=async()=>{if(!await BWC.confirmAction({title:'Remove resident account',message:'Remove your resident account and directory listing? You will need to register again for portal access.',confirmText:'Remove Account',danger:true})) return; await BWC.removeCurrentResident(); alert('Your resident account was removed.'); location.href='/resident-portal/';};
  document.querySelectorAll('[data-rsvp]').forEach(b=>b.onclick=()=>{data.portal.rsvps.push({id:BWC.uid('rsvp'),eventId:b.dataset.rsvp,residentId:resident.id,response:'yes',createdAt:new Date().toISOString()}); BWC.logAction(data,resident.id,'event.rsvp',b.dataset.rsvp); BWC.saveData(data); render();});
  $('reqUpload').onchange=async()=>{const file=$('reqUpload').files&&$('reqUpload').files[0]; if(!file) return; requestAttachment=await new Promise(resolve=>{const reader=new FileReader(); reader.onload=()=>resolve({name:file.name,url:reader.result,size:file.size,type:file.type}); reader.readAsDataURL(file);}); $('reqAttachmentName').textContent=`Attached: ${requestAttachment.name}`;};
  $('submitReq').onclick=async()=>{const description=BWC.sanitize($('reqText').value,600); if(!description) return setMessage('requestMsg','Enter request details before submitting.','error'); const type=$('reqType').value; const fileLink=BWC.sanitize($('reqFileLink').value,300); setMessage('requestMsg','Submitting request...','info'); data.portal.requests.push({id:BWC.uid('req'),caseNumber:`${type==='Architectural Change'?'ARC':'REQ'}-${Date.now()}`,residentId:resident.id,residentName:currentResident.name,residentEmail:currentResident.email,lot:currentResident.lot||'',parcel:currentResident.parcel||'',address:currentResident.address||'',type,status:'Submitted',description,fileLink,attachmentName:requestAttachment?.name||'',attachmentUrl:requestAttachment?.url||'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}); requestAttachment=null; BWC.logAction(data,resident.id,'request.submitted',type); await BWC.saveData(data); setMessage('requestMsg','Request submitted.','success'); render();};
  $('saveDirectoryListing').onclick=async()=>{currentResident.directoryOptIn=$('optin').checked; currentResident.name=BWC.sanitize($('dirName').value,120); currentResident.phone=BWC.sanitize($('dirPhone').value,40); currentResident.email=BWC.sanitize($('dirEmail').value,120).toLowerCase(); BWC.normalizeHouseholdContacts(currentResident); BWC.logAction(data,resident.id,'directory.profile.updated','Directory listing saved'); await BWC.saveData(data); render();};

  const savePortalModule=async(action,details)=>{BWC.logAction(data,resident.id,action,details||''); await BWC.saveData(data); await render();};
  document.querySelectorAll('[data-forum-category-sub]').forEach(input=>input.onchange=async()=>{
    currentResident.forumCategorySubscriptions=currentResident.forumCategorySubscriptions||{};
    currentResident.forumCategorySubscriptions[input.dataset.forumCategorySub]=input.checked;
    await savePortalModule('forum.category.subscription',`${input.dataset.forumCategorySub}: ${input.checked?'subscribed':'unsubscribed'}`);
  });
  const filterForums=()=>{const q=$('forumSearch').value.toLowerCase(); const category=$('forumFilter').value; document.querySelectorAll('[data-forum-thread-row]').forEach(row=>{const okCategory=category==='all'||row.dataset.category===category; const okSearch=row.dataset.keywords.includes(q); row.style.display=okCategory&&okSearch?'':'none';});};
  if($('forumSearch')) $('forumSearch').oninput=filterForums;
  if($('forumFilter')) $('forumFilter').onchange=filterForums;
  if($('createThread')) $('createThread').onclick=async()=>{
    const title=BWC.sanitize($('forumTitle').value,140);
    const body=BWC.sanitize($('forumBody').value,2000);
    if(!title||!body) return setMessage('forumMsg','Add a title and message before creating a thread.','error');
    const attachment=await fileToAttachment($('forumAttachment'));
    const thread={id:BWC.uid('thread'),categoryId:$('forumCategory').value,title,authorId:resident.id,authorName:residentDisplayName(currentResident),status:'open',locked:false,pinned:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    const post={id:BWC.uid('post'),threadId:thread.id,parentId:'',authorId:resident.id,authorName:residentDisplayName(currentResident),body,attachmentName:attachment.name,attachmentUrl:attachment.url,mentions:mentionsFrom(body),reported:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    data.portal.forumThreads.unshift(thread);
    data.portal.forumPosts.unshift(post);
    queueMentionNotifications(data,currentResident,body,'a forum thread');
    await savePortalModule('forum.thread.created',title);
  };
  document.querySelectorAll('[data-submit-reply]').forEach(btn=>btn.onclick=async()=>{
    const threadId=btn.dataset.submitReply;
    const textarea=document.querySelector(`[data-forum-reply="${threadId}"]`);
    const body=BWC.sanitize(textarea?.value,2000);
    if(!body) return;
    const attachment=await fileToAttachment(document.querySelector(`[data-forum-file="${threadId}"]`));
    const parentId=textarea?.dataset.parentId||'';
    data.portal.forumPosts.unshift({id:BWC.uid('post'),threadId,parentId,authorId:resident.id,authorName:residentDisplayName(currentResident),body,attachmentName:attachment.name,attachmentUrl:attachment.url,mentions:mentionsFrom(body),reported:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    const thread=data.portal.forumThreads.find(t=>t.id===threadId);
    if(thread) thread.updatedAt=new Date().toISOString();
    queueMentionNotifications(data,currentResident,body,'a forum reply');
    await savePortalModule('forum.reply.created',threadId);
  });
  document.querySelectorAll('[data-quote-post]').forEach(btn=>btn.onclick=()=>{
    const post=data.portal.forumPosts.find(p=>p.id===btn.dataset.quotePost);
    if(!post) return;
    const textarea=document.querySelector(`[data-forum-reply="${post.threadId}"]`);
    if(textarea){textarea.value=`> ${post.authorName || 'Resident'} wrote: ${post.body}\n\n`; textarea.dataset.parentId=post.id; textarea.focus();}
  });
  document.querySelectorAll('[data-report-post]').forEach(btn=>btn.onclick=async()=>{
    const post=data.portal.forumPosts.find(p=>p.id===btn.dataset.reportPost);
    if(!post) return;
    post.reported=true;
    post.reportedBy=resident.id;
    post.reportedAt=new Date().toISOString();
    await savePortalModule('forum.post.reported',post.id);
  });
  if($('newsletterOptIn')) $('newsletterOptIn').onchange=async()=>{currentResident.notificationPreferences=currentResident.notificationPreferences||{}; currentResident.notificationPreferences.newsletters=$('newsletterOptIn').checked; await savePortalModule('resident.newsletter.preference',String($('newsletterOptIn').checked));};
  if($('bulletinOptIn')) $('bulletinOptIn').onchange=async()=>{currentResident.notificationPreferences=currentResident.notificationPreferences||{}; currentResident.notificationPreferences.bulletins=$('bulletinOptIn').checked; await savePortalModule('resident.bulletin.preference',String($('bulletinOptIn').checked));};
  document.querySelectorAll('[data-submit-poll]').forEach(btn=>btn.onclick=async()=>{
    const poll=data.portal.polls.find(p=>p.id===btn.dataset.submitPoll);
    if(!poll||data.portal.pollResponses.some(r=>r.pollId===poll.id&&r.residentId===resident.id)) return;
    let answers=[],freeText='';
    if(poll.answerType==='free-text'){
      freeText=BWC.sanitize(document.querySelector(`[data-poll-free="${poll.id}"]`)?.value,1200);
      if(!freeText) return setMessage('pollMsg','Enter a response before submitting.','error');
    }else{
      answers=[...document.querySelectorAll(`[name="poll-${poll.id}"]:checked`)].map(input=>input.value);
      if(!answers.length) return setMessage('pollMsg','Choose an answer before submitting.','error');
    }
    data.portal.pollResponses.push({id:BWC.uid('pollresp'),pollId:poll.id,residentId:resident.id,residentName:poll.anonymous?'':residentDisplayName(currentResident),answers,freeText,anonymous:!!poll.anonymous,createdAt:new Date().toISOString()});
    await savePortalModule('poll.response.created',poll.question||poll.id);
  });
  const filterBulletins=()=>{const q=$('bulletinSearch').value.toLowerCase(); const category=$('bulletinFilter').value; document.querySelectorAll('[data-bulletin-row]').forEach(row=>{const okCategory=category==='All'||row.dataset.category===category; const okSearch=row.dataset.keywords.includes(q); row.style.display=okCategory&&okSearch?'':'none';});};
  if($('bulletinSearch')) $('bulletinSearch').oninput=filterBulletins;
  if($('bulletinFilter')) $('bulletinFilter').onchange=filterBulletins;
  if($('submitResidentBulletin')) $('submitResidentBulletin').onclick=async()=>{
    const title=BWC.sanitize($('residentBulletinTitle').value,140);
    const body=BWC.sanitize($('residentBulletinBody').value,1600);
    if(!title||!body) return setMessage('bulletinMsg','Add a title and post details.','error');
    data.portal.bulletins.unshift({id:BWC.uid('blt'),title,category:$('residentBulletinCategory').value,body,authorId:resident.id,authorName:residentDisplayName(currentResident),status:'Pending Review',startDate:todayIso(),expiresAt:'',attachmentName:'',attachmentUrl:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    await savePortalModule('bulletin.submitted',title);
  };

  if(resident.role==='admin'){
    const pending=(data.portal.residents||[]).filter(r=>r.status==='pending').map(r=>`<div class='item'><strong>${r.name}</strong><br>${r.address||'No address'}<br><small>${r.email}${r.phone?` · ${r.phone}`:''}${r.lot?` · Lot ${r.lot}`:''}${r.parcel?` · Parcel ${r.parcel}`:''} · Directory: ${r.directoryOptIn?'Yes':'No'}</small><button data-approve='${r.id}'>Approve${r.directoryOptIn?' & Add to Directory':''}</button> <button data-deny='${r.id}' class='secondary danger'>Suspend</button></div>`).join('')||'No pending approvals';
    $('pending').innerHTML=pending;
    document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{const row=data.portal.residents.find(x=>x.id===b.dataset.approve); if(row){row.status='active'; BWC.logAction(data,resident.id,'admin.approve',row.email); BWC.saveData(data); render();}});
    document.querySelectorAll('[data-deny]').forEach(b=>b.onclick=()=>{const row=data.portal.residents.find(x=>x.id===b.dataset.deny); if(row){row.status='suspended'; BWC.logAction(data,resident.id,'admin.suspend',row.email); BWC.saveData(data); render();}});
    $('addAnn').onclick=()=>{const title=BWC.sanitize($('annTitle').value,120); if(!title) return alert('Add a title.'); data.portal.announcements.unshift({id:BWC.uid('ann'),title,date:new Date().toISOString().slice(0,10)}); BWC.logAction(data,resident.id,'announcement.created',title); BWC.saveData(data); render();};
  }
}
render();
</script>
</body>
</html>
